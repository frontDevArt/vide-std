# Бриф ролика. Фаза 1 заполняет этот файл. Всё, что не указано, берётся из studio/project.py:DEFAULTS.
title: "Мозг на автопилоте: 80 исследований об одном вашем дне"
topic: "Мозг на автопилоте: 80 исследований об одном вашем дне"
audience: "Широкая аудитория научпопа, без подготовки; вынести: сбои внимания и памяти — экономия (скорость вместо точности); популярные психофакты теряют оговорки по дороге в ленту; три практических совета"
language: ru              # язык озвучки и текста: ru | en | ... (studio/lang.py). Голос auto берётся отсюда
format: horizontal          # vertical 1080×1920 | horizontal 1920×1080 | square 1080×1080
fps: 30
target_duration: null     # секунды, если длительность должна быть ТОЧНОЙ (Shorts/Reels); null — по речи

tts:
  backend: piper          # rhvoice (офлайн, ставится tools/setup_rhvoice.sh) | edge (онлайн) | piper (офлайн нейро)
  voice: ru_RU-ruslan-medium # auto — по языку (studio/lang.py). ru: aleksandr-hq | ru-RU-DmitryNeural | ru_RU-dmitri-medium;
                          #   en: slt | en-US-GuyNeural | en_US-lessac-medium
  rate: 100               # piper: 100 = length_scale 1.0; зафиксировано
  rate_range: [92, 112]   # проценты от естественного

pauses:                   # секунды
  start: 0.45             # тишина в начале ролика
  comma: 0.18             # после строки, оканчивающейся на , : ; —
  sentence: 0.40          # после строки, оканчивающейся на . ! ?
  scene: 0.55             # между сценами
  end: 0.6                # в конце ролика

style:
  palette: calm           # neon | calm  (studio/gfx.py: PALETTES)
  font: Inter Display

music:
  enabled: true
  level_db: -13           # уровень подложки; QA требует, чтобы музыка была на 14–28 LU тише голоса
  duck: true              # приглушать музыку под голосом
  # file: path/to/music.wav   # своя музыка вместо процедурной (будет зациклена)

subtitles:
  enabled: true
  max_lines: 2

loudness: -16             # LUFS итога (YouTube/соцсети: -14…-16)

chapters: [ch00, ch01, ch02, ch03, ch04, ch05, ch06, ch07, ch08, ch09]              # порядок глав: [ch01, ch02, ...] -> файлы script/ch01.yaml ...
