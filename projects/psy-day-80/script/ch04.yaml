chapter: ch04
title: "13:00 — Обед"
scenes:
  - id: s00
    template: day_stop
    lines:
      - "Тринадцать ноль-ноль."
      - "Остановка четвёртая — обед."
    params:
      facts: "факты 31–40"
      facts_beat: 1

  - id: f31
    template: day_fact
    lines:
      - "Тридцать первый."
      - "По пищевым дневникам, | в компании порции в среднем на сорок четыре процента больше, | чем в одиночку."
      - "Один сотрапезник — | примерно плюс треть, | семь и больше — | почти вдвое."
    params:
      n: 31
      title: "В компании едим *больше*"
      title_beat: 1
      value: "+44%"
      label: "к порции — в среднем за компанию"
      value_beat: 2
      chips: ["1 сотрапезник — ≈+⅓", "7 и больше — почти ×2"]
      chips_beat: 4
      src: "de Castro, 1994"

  - id: f32
    template: day_fact
    lines:
      - "Тридцать второй."
      - "Обед за экраном | может не изменить сам обед."
      - "Но в одном эксперименте те, кто ел, отвлекаясь на игру, | хуже его помнили | и позже съедали больше печенья."
    params:
      n: 32
      icon: brain
      title: "Обед за экраном — *перекус больше*"
      title_beat: 1
      chips: ["Обед помнят хуже", "Позже едят больше"]
      chips_beat: 3
      src: "Oldham-Cooper et al., 2011"

  - id: f33
    template: day_fact
    lines:
      - "Тридцать третий."
      - "Многое из того, что мы зовём вкусом, — | это запах, | который идёт к носу изнутри рта."
      - "А популярной цифре | «ровно восемьдесят процентов» | надёжного источника нет."
    params:
      n: 33
      icon: question
      title: "Вкус — это во многом *запах*"
      title_beat: 1
      chips: ["«Ровно 80%» — без источника"]
      chips_beat: 4

  - id: f34
    template: day_fact
    lines:
      - "Тридцать четвёртый."
      - "На одном аукционе | платившие картой предлагали за билеты на баскетбол | около шестидесяти долларов, | а платившие наличными — двадцать восемь."
      - "Правда, крупная повторная проверка | этого не подтвердила."
    params:
      n: 34
      title: "Карта *против* наличных"
      title_beat: 1
      bars:
        - {label: "Картой", value: 60, text: "≈$60", color: accent}
        - {label: "Наличными", value: 28, text: "$28", color: dim}
      bars_beat: 2
      chips: ["Повтор не подтвердил"]
      chips_beat: 5
      src: "Prelec & Simester, 2001"

  - id: f35
    template: day_fact
    lines:
      - "Тридцать пятый."
      - "Два девяносто девять | кажется дешевле трёх | намного сильнее, чем на копейку."
      - "Мозг цепляется за первую цифру."
    params:
      n: 35
      title: "Цена решает *первой цифрой*"
      title_beat: 1
      value: "2,99"
      count: false
      label: "кажется заметно меньше, чем 3"
      value_beat: 1
      src: "Thomas & Morwitz, 2005"

  - id: f36
    template: day_myth
    lines:
      - "Тридцать шестой — проверка мифа."
      - "«Слишком большой выбор отпугивает покупателя»."
      - "В знаменитом опыте с вареньем | при шести сортах купили тридцать процентов подошедших, | при двадцати четырёх — | лишь три."
      - "Но к большой витрине подходило больше людей: | шестьдесят процентов против сорока."
      - "А в сводке пятидесяти экспериментов | средний эффект оказался около нуля."
      - "Вердикт: | частично."
    params:
      n: 36
      myth: "«Большой выбор *отпугивает»*"
      bars:
        - {label: "6 сортов", value: 30, text: "30% купили", color: accent}
        - {label: "24 сорта", value: 3, text: "3%", color: red}
      bars_beat: 2
      chips: ["Подходили: 60% против 40%", "50 опытов: эффект ≈0"]
      chips_beat: 6
      verdict: "partly"
      verdict_beat: 11
      src: "Iyengar & Lepper, 2000; Scheibehenne et al., 2010"

  - id: f37
    template: day_fact
    lines:
      - "Тридцать седьмой."
      - "Добавьте заведомо худший вариант — | и людей потянет к тому, | на который он похож."
      - "Маркетологи зовут это приманкой."
    params:
      n: 37
      icon: target
      title: "Худший вариант — *приманка*"
      title_beat: 1
      chips: ["Эффект приманки"]
      chips_beat: 4
      src: "Huber, Payne & Puto, 1982"

  - id: f38
    template: day_fact
    lines:
      - "Тридцать восьмой."
      - "Студенты, которым дали кружку, | хотели продать её примерно за семь долларов."
      - "А те, у кого кружки не было, | готовы были заплатить около трёх."
    params:
      n: 38
      title: "Своё *дороже*"
      title_beat: 1
      bars:
        - {label: "Продать свою", value: 7, text: "≈$7", color: accent}
        - {label: "Купить", value: 3, text: "≈$3", color: dim}
      bars_beat: 2
      src: "Kahneman, Knetsch & Thaler, 1990"

  - id: f39
    template: day_fact
    lines:
      - "Тридцать девятый."
      - "В томографе вино «за девяносто долларов» | казалось приятнее | того же самого вина «за десять»."
      - "Через несколько недель, вслепую, | разницы не нашли."
    params:
      n: 39
      icon: eye
      title: "Ценник *меняет вкус*"
      title_beat: 1
      value: "$90 > $10"
      count: false
      label: "одно и то же вино"
      value_beat: 1
      chips: ["Вслепую — разницы нет"]
      chips_beat: 4
      src: "Plassmann et al., 2008"

  - id: f40
    template: day_fact
    lines:
      - "Сороковой."
      - "Колесо останавливалось на десяти или на шестидесяти пяти."
      - "После этого долю африканских стран в о-о-эн | люди оценивали в среднем | в двадцать пять | и в сорок пять процентов."
      - "Плата за точный ответ | эффект не уменьшала."
    params:
      n: 40
      title: "Случайное число *сдвигает оценку*"
      title_beat: 1
      bars:
        - {label: "Колесо: 10", value: 25, text: "25%", color: dim}
        - {label: "Колесо: 65", value: 45, text: "45%", color: accent}
      bars_beat: 4
      chips: ["Награда не помогла"]
      chips_beat: 6
      src: "Tversky & Kahneman, 1974"

  - id: s99
    template: day_statement
    lines:
      - "Дальше вечер, | зеркало | и вопрос, | как мы на самом деле выглядим."
    params:
      text: "Дальше — *у зеркала*"
      icon: eye
      at_beat: 1
