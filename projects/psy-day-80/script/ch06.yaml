chapter: ch06
title: "19:30 — Ужин с друзьями"
scenes:
  - id: s00
    template: day_stop
    lines:
      - "Девятнадцать тридцать."
      - "Остановка шестая — ужин с друзьями."
    params:
      facts: "факты 51–60"
      facts_beat: 1

  - id: f51
    template: day_fact
    lines:
      - "Пятьдесят первый."
      - "В пятидесятых людям давали в наушники два голоса | и просили следить за одним."
      - "Что второй перешёл с английского на немецкий, | почти никто не заметил."
      - "А вот своё имя в нём | услышала примерно треть."
    params:
      n: 51
      icon: bell
      title: "Эффект *шумной вечеринки*"
      title_beat: 1
      chips: ["Смена языка — не заметили", "Своё имя — услышала ≈⅓"]
      chips_beat: 4
      src: "Cherry, 1953; Moray, 1959"

  - id: f52
    template: day_fact
    lines:
      - "Пятьдесят второй."
      - "В небольшом исследовании своё имя в шуме | услышали шестьдесят пять процентов людей | с меньшей рабочей памятью"
      - "и лишь двадцать — с большей."
      - "Выходит, дело скорее в фильтре шума, | чем в бдительности."
    params:
      n: 52
      title: "Имя в шуме — *слабый фильтр*"
      title_beat: 1
      bars:
        - {label: "Память меньше", value: 65, text: "65%", color: accent}
        - {label: "Память больше", value: 20, text: "20%", color: dim}
      bars_beat: 3
      src: "Conway, Cowan & Bunting, 2001"

  - id: f53
    template: day_fact
    lines:
      - "Пятьдесят третий."
      - "Лишь от десяти до двадцати процентов смеха | следует за чем-то похожим на шутку."
      - "А говорящий смеётся | почти в полтора раза чаще слушателей."
    params:
      n: 53
      title: "Смеёмся *не над шутками*"
      title_beat: 1
      value: "10–20%"
      count: false
      label: "смеха — после чего-то похожего на шутку"
      value_beat: 1
      chips: ["Говорящий смеётся ≈ в 1,5 раза чаще"]
      chips_beat: 3
      src: "Provine, 2000"

  - id: f53b
    template: day_statement
    lines:
      - "А в компании мы смеёмся | примерно в тридцать раз чаще, | чем в одиночку."
    params:
      text: "В компании смеёмся *в 30 раз чаще*"
      icon: laugh
      sub: "Provine, 2000"
      at_beat: 1

  - id: f54
    template: day_fact
    lines:
      - "Пятьдесят четвёртый."
      - "Видео с зевающими людьми | заставило зевнуть пятьдесят пять процентов зрителей."
      - "А в жизни зевота заразнее всего | между родными,"
      - "потом — между друзьями и знакомыми, | и слабее всего — между незнакомцами."
    params:
      n: 54
      title: "Зевота *заразна* — для своих"
      title_beat: 1
      value: "55%"
      label: "зрителей зевнули сами"
      value_beat: 2
      chips: ["Родные → друзья → знакомые → незнакомцы"]
      chips_beat: 4
      src: "Provine, 1986; Norscia & Palagi, 2011"

  - id: f55
    template: day_fact
    lines:
      - "Пятьдесят пятый."
      - "В эксперименте люди отказывались | примерно от семнадцати процентов заработка,"
      - "лишь бы отвечать на вопросы | о себе."
    params:
      n: 55
      title: "Говорить о себе — *дороже денег*"
      title_beat: 1
      value: "17%"
      label: "заработка — ради разговора о себе"
      value_beat: 2
      src: "Tamir & Mitchell, 2012"

  - id: f56
    template: day_fact
    lines:
      - "Пятьдесят шестой."
      - "Когда компания за столом растёт, | разговор сам распадается на кружки."
      - "Один разговор обычно вмещает | не больше четырёх человек."
    params:
      n: 56
      title: "Потолок разговора — *четверо*"
      title_beat: 1
      value: "4"
      count: false
      label: "человека — максимум в одном разговоре"
      value_beat: 4
      src: "Dunbar, Duncan & Nettle, 1995"

  - id: f57
    template: day_fact
    lines:
      - "Пятьдесят седьмой."
      - "Из почти тысячи разговоров | лишь два процента закончились тогда, | когда этого хотели оба."
      - "Остальные шли дольше или короче, | чем хотелось хотя бы одному."
    params:
      n: 57
      icon: hourglass
      title: "Разговор *не вовремя* кончается"
      title_beat: 1
      value: "2%"
      label: "разговоров закончились, когда хотели оба"
      value_beat: 2
      src: "Mastroianni et al., 2021"

  - id: f58
    template: day_fact
    lines:
      - "Пятьдесят восьмой."
      - "Если собеседник незаметно | повторяет вашу позу,"
      - "он вам, по экспериментам, | нравится чуть больше."
    params:
      n: 58
      icon: eye
      title: "Эффект *хамелеона*"
      title_beat: 1
      chips: ["Копирует позу → нравится больше"]
      chips_beat: 3
      src: "Chartrand & Bargh, 1999"

  - id: f59
    template: day_myth
    lines:
      - "Пятьдесят девятый — проверка мифа."
      - "«Одиночество вредит, | как пятнадцать сигарет в день»."
      - "Исследование нашло другое: | у людей с крепкими связями | шансы дожить до конца наблюдения | были на пятьдесят процентов выше."
      - "Сигареты — вольное сравнение, | и говорили так о нехватке связей, | а не о чувстве одиночества."
      - "Вердикт: | частично."
    params:
      n: 59
      myth: "«Одиночество — как *15 сигарет»*"
      value: "+50%"
      count: false
      label: "шансов дожить — с крепкими связями"
      value_beat: 6
      chips: ["Сигареты — вольное сравнение", "Про нехватку связей, не про чувство"]
      chips_beat: 7
      verdict: "partly"
      verdict_beat: 11
      src: "Holt-Lunstad et al., 2010"

  - id: f60
    template: day_fact
    lines:
      - "Шестидесятый."
      - "Большая часть непринуждённой болтовни — | о людях:"
      - "о знакомых | и о себе."
    params:
      n: 60
      icon: laugh
      title: "Болтаем *о людях*"
      title_beat: 1
      chips: ["О знакомых", "О себе"]
      chips_beat: 3
      src: "Dunbar, Marriott & Duncan, 1997"

  - id: s99
    template: day_statement
    lines:
      - "Гости разошлись — | дальше диван и телефон."
    params:
      text: "Дальше — *диван и телефон*"
      icon: phone
      at_beat: 1
