chapter: ch01
title: "07:00 — Подъём"
scenes:
  - id: s00
    template: day_stop
    lines:
      - "Семь утра."
      - "Остановка первая — подъём."
    params:
      facts: "факты 1–10"
      facts_beat: 1

  - id: f01
    template: day_fact
    lines:
      - "Первый."
      - "Первые минуты после пробуждения | мы соображаем примерно как после бессонной ночи — | это инерция сна."
      - "Она проходит за время до часа, | а самый провал в небольшом эксперименте пришёлся на первые три минуты."
    params:
      n: 1
      title: "Первые минуты после сна ≈ *бессонная ночь*"
      title_beat: 1
      chips: ["Инерция сна — до часа", "Самый провал — первые 3 минуты"]
      chips_beat: 4
      src: "Wertz et al., 2006"

  - id: f02
    template: day_fact
    lines:
      - "Второй."
      - "«Ещё пять минут»: | в одном опросе кнопку повтора жмут | пятьдесят семь процентов работающих взрослых."
      - "А в шведском эксперименте полчаса повторов отняли | всего около шести минут сна | и не ухудшили мышление."
    params:
      n: 2
      title: "Кнопка *«ещё 5 минут»*"
      title_beat: 0
      value: "57%"
      label: "работающих взрослых жмут повтор"
      value_beat: 3
      chips: ["30 минут повторов = −6 минут сна", "Мышление не хуже"]
      chips_beat: 5
      src: "Sundelin et al., 2023"

  - id: f03
    template: day_fact
    lines:
      - "Третий."
      - "Кофе не добавляет энергии — он глушит сигнал усталости."
      - "Кофеин занимает рецепторы аденозина — | вещества, которое весь день подталкивает мозг ко сну."
    params:
      n: 3
      icon: bolt
      title: "Кофе *не даёт* энергию — он глушит усталость"
      title_beat: 1
      chips: ["Кофеин занимает рецепторы аденозина", "Аденозин — сигнал «пора спать»"]
      chips_beat: 2

  - id: f04
    template: day_fact
    lines:
      - "Четвёртый."
      - "Исследователи разобрали около полумиллиарда твитов, | и самые позитивные формулировки пришлись на раннее утро."
      - "Дальше по ходу дня настроение понемногу тает."
    params:
      n: 4
      icon: chart
      title: "Самые позитивные слова — *ранним утром*"
      title_beat: 2
      value: "~500 млн"
      count: false
      label: "твитов из 84 стран"
      value_beat: 1
      src: "Golder & Macy, 2011"

  - id: f05
    template: day_fact
    lines:
      - "Пятый."
      - "Мелодия, которая засела в голове, — это норма."
      - "Из двенадцати с лишним тысяч опрошенных | восемьдесят девять процентов ловят такую хотя бы раз в неделю."
    params:
      n: 5
      icon: play
      title: "Мелодия застряла в голове — *это норма*"
      title_beat: 1
      value: "89%"
      label: "из 12 000+ опрошенных — раз в неделю и чаще"
      value_beat: 3
      src: "Liikkanen, 2012"

  - id: f06
    template: day_fact
    lines:
      - "Шестой."
      - "Собственный голос в записи звучит «не так», | потому что обычно мы слышим себя ещё и через кости черепа."
      - "А микрофон ловит только звук, пришедший по воздуху."
    params:
      n: 6
      title: "Голос в записи — *«не мой»*"
      title_beat: 1
      chips: ["Вы слышите себя: воздух + кости черепа", "Микрофон: только воздух"]
      chips_beat: 2

  - id: f07
    template: day_myth
    lines:
      - "Седьмой — и первая проверка мифа."
      - "«Привычка формируется за двадцать один день»."
      - "В исследовании две тысячи десятого года понадобилось | в среднем шестьдесят шесть дней, | а у разных людей — от восемнадцати | до примерно двухсот пятидесяти четырёх."
      - "Причём один пропущенный день почти ничего не ломал."
      - "Вердикт: | не подтвердилось."
    params:
      n: 7
      myth: "«Привычка формируется за *21 день»*"
      bars:
        - {label: "Миф", value: 21, text: "21 день", color: red}
        - {label: "В среднем", value: 66, text: "66 дней", color: accent}
        - {label: "Разброс", value: 254, text: "18–254", color: dim}
      bars_beat: 2
      chips: ["Пропуск дня почти не мешает"]
      chips_beat: 6
      verdict: "no"
      verdict_beat: 8
      src: "Lally et al., 2010"

  - id: f08
    template: day_fact
    lines:
      - "Восьмой."
      - "Обзор коротких и в основном слабых испытаний: завтрак не помогал худеть."
      - "А завтракающие в сумме съедали | примерно на двести шестьдесят килокалорий в день больше."
    params:
      n: 8
      title: "Завтрак *не помогал* худеть"
      title_beat: 1
      value: "+260 ккал"
      label: "в день у завтракающих"
      value_beat: 2
      src: "Sievert et al., 2019"

  - id: f09
    template: day_fact
    lines:
      - "Девятый."
      - "Идея, что сила воли кончается, как бензин в баке, проверку не выдержала."
      - "Её повторили двадцать три лаборатории | на двух с лишним тысячах участников."
    params:
      n: 9
      icon: bolt
      title: "Сила воли — *не бензин*"
      title_beat: 1
      chips: ["23 лаборатории", "2000+ участников — «истощения» не нашли"]
      chips_beat: 2
      src: "Hagger et al., 2016"

  - id: f10
    template: day_fact
    lines:
      - "Десятый."
      - "Зашли на кухню и забыли, зачем пришли?"
      - "Команда Габриэля Радвански из университета Нотр-Дам просила людей переносить предметы, | и переход через дверной проём стирал из памяти больше, | чем такой же путь внутри одной комнаты."
    params:
      n: 10
      title: "Дверной проём *стирает* память"
      title_beat: 1
      chips: ["Через дверь — забываем больше", "Тот же путь в одной комнате — меньше"]
      chips_beat: 3
      src: "Radvansky et al., 2011"

  - id: f10b
    template: day_statement
    lines:
      - "Правда, повтор двадцать первого года нашёл этот эффект, | только когда голова была занята чем-то ещё."
    params:
      text: "Повтор: эффект есть, *только если голова занята*"
      sub: "McFadyen et al., 2021"
      at_beat: 0

  - id: s99
    template: day_statement
    lines:
      - "Кофе выпит, зачем шли на кухню — вспомнили. | Пора в дорогу."
    params:
      text: "Пора *в дорогу*"
      icon: target
      at_beat: 1
