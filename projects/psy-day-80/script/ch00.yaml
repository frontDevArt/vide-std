chapter: ch00
title: "Вступление"
scenes:
  - id: s01
    template: day_statement
    lines:
      - "Люди сами били себя током — | лишь бы не провести пятнадцать минут наедине с собственными мыслями."
    params:
      text: "Удар током — *или* 15 минут наедине с мыслями?"
      icon: bolt
      color: accent2
      at_beat: 0

  - id: s02
    template: day_statement
    lines:
      - "Это одна из восьмидесяти находок, о которых пойдёт речь."
      - "Подробности будут вечером, на седьмой остановке."
    params:
      text: "Подробности — *вечером*"
      icon: clock
      sub: "остановка 7 · 21:15"
      at_beat: 0

  - id: s03
    template: day_fact
    lines:
      - "Правила простые."
      - "Один обычный день, | восемь остановок, | по десять исследований на каждой, | и у каждого есть источник."
    params:
      title: "Правила *игры*"
      title_beat: 0
      chips: ["Один обычный день", "8 остановок", "По 10 исследований на каждой", "У каждого — источник"]
      chips_beat: 1

  - id: s04
    template: day_statement
    lines:
      - "А на каждой остановке один популярный «факт» из интернета идёт на проверку."
      - "И большинство таких фактов её не проходят."
    params:
      text: "Каждая остановка — *одна проверка мифа*"
      icon: eye
      sub: "большинство мифов проверку не проходят"
      at_beat: 0

  - id: s05
    template: day_myth
    lines:
      - "Для разминки — классика из сети."
      - "Не можешь уснуть — значит, ты кому-то снишься."
      - "Красиво. | Но к психологии это отношения не имеет."
    params:
      chip: "РАЗМИНКА · ПРОВЕРКА МИФА"
      myth: "«Не спится — значит, ты кому-то *снишься»*"
      verdict: "no"
      verdict_text: "НЕ ПСИХОЛОГИЯ"
      verdict_beat: 3

  - id: s06
    template: day_statement
    lines:
      - "Итак, утро. | Будильник уже звонит."
    params:
      text: "Итак, *утро*"
      icon: bell
      at_beat: 0
