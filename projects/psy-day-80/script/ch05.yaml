chapter: ch05
title: "18:20 — У зеркала"
scenes:
  - id: s00
    template: day_stop
    lines:
      - "Восемнадцать двадцать."
      - "Остановка пятая — у зеркала."
    params:
      facts: "факты 41–50"
      facts_beat: 1

  - id: f41
    template: day_myth
    lines:
      - "Сорок первый — проверка мифа."
      - "«Другие видят вас красивее, | чем вы себя в зеркале»."
      - "Доказательств этому нет, | а настоящая находка интереснее."
      - "Женщины предпочитали зеркальную версию своего фото — | ту, что видят каждое утро."
      - "А их друзья и партнёры — обычную."
      - "Каждый выбирал привычное лицо."
      - "Вердикт: | не подтвердилось."
    params:
      n: 41
      myth: "«Другие видят вас *красивее»*"
      chips: ["Себе — зеркальное фото", "Друзьям — обычное"]
      chips_beat: 6
      verdict: "no"
      verdict_beat: 10
      src: "Mita, Dermer & Knight, 1977"

  - id: f42
    template: day_fact
    lines:
      - "Сорок второй."
      - "Людям показывали их лицо, | слегка подправленное в сторону красоты | и в обратную."
      - "Своим они чаще называли | приукрашенный вариант."
    params:
      n: 42
      icon: eye
      title: "Себя помним *красивее*"
      title_beat: 1
      chips: ["Узнают себя в улучшенной версии"]
      chips_beat: 4
      src: "Epley & Whitchurch, 2008"

  - id: f43
    template: day_fact
    lines:
      - "Сорок третий."
      - "Отражение лица на стекле зеркала | ровно вдвое меньше самого лица."
      - "Но люди уверены, что оно в натуральную величину, | даже стоя перед зеркалом."
    params:
      n: 43
      title: "Отражение *вдвое меньше*"
      title_beat: 1
      value: "½"
      count: false
      label: "размер лица на стекле зеркала"
      value_beat: 2
      src: "Bertamini et al., 2003"

  - id: f44
    template: day_fact
    lines:
      - "Сорок четвёртый."
      - "Студенты в неловкой футболке с Барри Манилоу | думали, что их заметила почти половина зала."
      - "На деле — меньше четверти."
      - "Это эффект прожектора: | на нас смотрят реже, чем кажется."
    params:
      n: 44
      title: "Эффект *прожектора*"
      title_beat: 1
      bars:
        - {label: "Ожидали", value: 46, text: "46%", color: dim}
        - {label: "Заметили", value: 23, text: "23%", color: accent}
      bars_beat: 2
      chips: ["На нас смотрят реже"]
      chips_beat: 5
      src: "Gilovich, Medvec & Savitsky, 2000"

  - id: f45
    template: day_fact
    lines:
      - "Сорок пятый."
      - "Из нескольких своих фото | человек выбирал для профиля не лучшее."
      - "Незнакомцы чаще находили снимок, | на котором он выглядит надёжнее и компетентнее."
    params:
      n: 45
      icon: target
      title: "Фото для профиля — *пусть выберут другие*"
      title_beat: 1
      chips: ["Незнакомцы выбирают удачнее"]
      chips_beat: 3
      src: "White, Sutherland & Burton, 2017"

  - id: f46
    template: day_fact
    lines:
      - "Сорок шестой."
      - "В одном опросе девяносто процентов назвали чужие селфи | самопиаром, | а свои — лишь сорок шесть."
      - "И восемьдесят два процента | предпочли бы видеть в ленте обычные фото."
    params:
      n: 46
      title: "Самопиар — *это у других*"
      title_beat: 1
      bars:
        - {label: "Чужие селфи", value: 90, text: "90%", color: accent}
        - {label: "Свои селфи", value: 46, text: "46%", color: dim}
      bars_beat: 2
      chips: ["82% — за обычные фото"]
      chips_beat: 4
      src: "Diefenbach & Christoforakos, 2017"

  - id: f47
    template: day_fact
    lines:
      - "Сорок седьмой."
      - "«Поза силы» | может чуть прибавить уверенности."
      - "Но в оригинале было сорок два человека, | а в повторе на двести | изменений гормонов не нашли."
      - "Одна из авторов оригинала | позже сказала, что не верит в эффект."
    params:
      n: 47
      title: "Поза силы: *гормоны — нет*"
      title_beat: 1
      bars:
        - {label: "Оригинал", value: 42, text: "42 чел.", color: dim}
        - {label: "Повтор", value: 200, text: "200 чел.", color: accent}
      bars_beat: 3
      chips: ["Гормоны — без изменений", "Автор оригинала: «не верю»"]
      chips_beat: 5
      src: "Carney et al., 2010; Ranehill et al., 2015"

  - id: f48
    template: day_fact
    lines:
      - "Сорок восьмой."
      - "Нарочная улыбка | слегка поднимает настроение."
      - "Трюк с ручкой в зубах | надёжно не повторяется."
      - "Но проверка почти на четырёх тысячах людей | из девятнадцати стран | подтвердила небольшой эффект."
    params:
      n: 48
      icon: laugh
      title: "Улыбка *поднимает настроение*"
      title_beat: 1
      chips: ["Ручка в зубах — не повторилось", "≈4000 человек, 19 стран — эффект есть"]
      chips_beat: 4
      src: "Coles et al., 2022"

  - id: f49
    template: day_fact
    lines:
      - "Сорок девятый."
      - "Тот самый «чужой» голос из записи."
      - "Когда его незаметно подмешивали к другим, | люди оценивали свой голос привлекательнее, | чем посторонние слушатели."
    params:
      n: 49
      icon: play
      title: "Свой голос *нравится* — вслепую"
      title_beat: 1
      chips: ["Себе — привлекательнее"]
      chips_beat: 3
      src: "Hughes & Harrison, 2013"

  - id: f50
    template: day_fact
    lines:
      - "Пятидесятый."
      - "Красивым незнакомцам | мы приписываем приятный характер."
      - "Позже выяснилось: | связь есть в основном с умением общаться, | а не с характером."
    params:
      n: 50
      icon: heart
      title: "Красивый — *значит, добрый?*"
      title_beat: 1
      chips: ["Связь — с умением общаться"]
      chips_beat: 4
      src: "Dion et al., 1972; Feingold, 1992"

  - id: s99
    template: day_statement
    lines:
      - "Из дома — в гости: | дальше ужин с друзьями."
    params:
      text: "Дальше — *ужин с друзьями*"
      icon: laugh
      at_beat: 1
