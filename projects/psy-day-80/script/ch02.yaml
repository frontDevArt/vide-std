chapter: ch02
title: "08:10 — Дорога"
scenes:
  - id: s00
    template: day_stop
    lines:
      - "Восемь десять."
      - "Остановка вторая — дорога."
    params:
      facts: "факты 11–20"
      facts_beat: 1

  - id: f11
    template: day_fact
    lines:
      - "Одиннадцатый."
      - "Тысячам людей писали в случайные моменты дня, | и почти половину времени их мысли были не здесь."
      - "И в эти минуты | люди чувствовали себя менее счастливыми."
    params:
      n: 11
      icon: brain
      title: "Мысли *не здесь*"
      title_beat: 1
      value: "~47%"
      count: false
      label: "времени ум блуждает"
      value_beat: 2
      chips: ["В эти минуты — менее счастливы"]
      chips_beat: 3
      src: "Killingsworth & Gilbert, 2010"

  - id: f12
    template: day_fact
    lines:
      - "Двенадцатый."
      - "В симуляторе люди много раз ездили одним маршрутом | и начали ехать на автопилоте."
      - "Подменённые знаки они замечали хуже, | зато лучше видели изменения самой дороги, | например пропавшую разметку."
    params:
      n: 12
      icon: eye
      title: "Знакомый маршрут — *автопилот*"
      title_beat: 1
      chips: ["Подменённые знаки — замечали хуже", "Пропавшую разметку — лучше"]
      chips_beat: 3
      src: "Charlton & Starkey, 2013"

  - id: f13
    template: day_fact
    lines:
      - "Тринадцатый."
      - "Работающие женщины по часам вспоминали вчерашний день."
      - "Из шестнадцати занятий | дорога на работу оказалась последней по приятным чувствам."
    params:
      n: 13
      title: "Дорога на работу — *на последнем месте*"
      title_beat: 2
      value: "16 из 16"
      count: false
      label: "по приятным эмоциям"
      value_beat: 2
      src: "Kahneman et al., 2004"

  - id: f14
    template: day_fact
    lines:
      - "Четырнадцатый."
      - "«Соседний ряд едет быстрее» — | так решили семьдесят процентов студентов, | смотревших записи реального трафика."
      - "На деле он ехал чуть медленнее."
      - "Обгоняем мы быстро, а нас обгоняют долго — | и эти долгие минуты запоминаются."
    params:
      n: 14
      title: "Соседний ряд *не быстрее*"
      title_beat: 1
      value: "70%"
      label: "студентов-водителей уверены в обратном"
      value_beat: 2
      chips: ["Нас обгоняют долго — это и помним"]
      chips_beat: 5
      src: "Redelmeier & Tibshirani, 1999"

  - id: f15
    template: day_myth
    lines:
      - "Пятнадцатый — проверка мифа."
      - "«С гарнитурой говорить за рулём безопасно»."
      - "В симуляторе разговор по телефону | примерно вдвое повышал число пропущенных красных."
      - "Гарнитура была ничем не лучше трубки в руке, | а радио так не мешало."
      - "Мешает сам разговор. | Вердикт: | не подтвердилось."
    params:
      n: 15
      myth: "«С гарнитурой говорить за рулём *безопасно»*"
      bars:
        - {label: "Радио", value: 1, text: "×1", color: dim}
        - {label: "Трубка", value: 2, text: "≈×2", color: red}
        - {label: "Гарнитура", value: 2, text: "≈×2", color: red}
      bars_beat: 2
      chips: ["Мешает сам разговор"]
      chips_beat: 6
      verdict: "no"
      verdict_beat: 8
      src: "Strayer & Johnston, 2001"

  - id: f16
    template: day_fact
    lines:
      - "Шестнадцатый."
      - "В другом эксперименте говорящие по телефону | были выключены примерно как водители | с алкоголем на допустимом пределе — | просто по-другому."
      - "Все три столкновения сзади устроили говорившие."
    params:
      n: 16
      icon: phone
      title: "Разговор ≈ *алкоголь на пределе нормы*"
      title_beat: 1
      chips: ["Все 3 столкновения сзади — у говоривших"]
      chips_beat: 5
      src: "Strayer, Drews & Crouch, 2006"

  - id: f17
    template: day_fact
    lines:
      - "Семнадцатый."
      - "Полевое исследование: | водители кабриолетов с поднятой крышей | сигналили раньше и дольше, чем с опущенной."
      - "Когда тебя не видно, грубить проще."
    params:
      n: 17
      icon: bell
      title: "Крыша поднята — *сигналим злее*"
      title_beat: 1
      chips: ["Сигналят раньше", "И дольше"]
      chips_beat: 3
      src: "Ellison et al., 1995"

  - id: f18
    template: day_fact
    lines:
      - "Восемнадцатый."
      - "Двадцать две машины ехали по кругу с постоянной скоростью — | и пробка возникла сама, | без аварии и сужения."
      - "А волна затора покатилась назад."
    params:
      n: 18
      title: "Пробка *из ничего*"
      title_beat: 1
      value: "22"
      label: "машины по кругу — и затор"
      value_beat: 1
      chips: ["Волна катится назад"]
      chips_beat: 4
      src: "Sugiyama et al., 2008"

  - id: f19
    template: day_fact
    lines:
      - "Девятнадцатый."
      - "Пассажиры поезда думали, | что разговор с незнакомцем хуже, чем ехать молча."
      - "Тем, кого попросили попробовать, | поездка понравилась больше."
    params:
      n: 19
      icon: heart
      title: "Поговорить с незнакомцем — *приятнее*"
      title_beat: 1
      chips: ["Ждали: хуже, чем молчать", "Вышло: поездка лучше"]
      chips_beat: 3
      src: "Epley & Schroeder, 2014"

  - id: f20
    template: day_fact
    lines:
      - "Двадцатый."
      - "«Мы используем десять процентов мозга» — | томография ни разу не нашла спящих отделов."
      - "Мозг весит около трёх процентов тела, | а тратит около двадцати процентов его энергии."
    params:
      n: 20
      icon: brain
      title: "Мозг работает *весь*"
      title_beat: 1
      chips: ["≈3% веса тела", "≈20% энергии"]
      chips_beat: 3

  - id: s99
    template: day_statement
    lines:
      - "Доехали — с автопилотом, но без аварий. | Впереди совещание."
    params:
      text: "Впереди *совещание*"
      icon: clock
      at_beat: 1
