chapter: ch07
title: "21:15 — Диван и телефон"
scenes:
  - id: s00
    template: day_stop
    lines:
      - "Двадцать один пятнадцать."
      - "Остановка седьмая — диван и телефон."
    params:
      facts: "факты 61–70"
      facts_beat: 1

  - id: f61
    template: day_fact
    lines:
      - "Шестьдесят первый — обещанное в начале."
      - "Команда Тимоти Уилсона оставляла людей | на пятнадцать минут в пустой комнате —"
      - "наедине с мыслями | и с кнопкой слабого удара током."
      - "Все этот удар уже пробовали | и говорили, что заплатили бы, | лишь бы его избежать."
    params:
      n: 61
      icon: bolt
      title: "*Ток* вместо скуки"
      title_beat: 1
      value: "15 мин"
      count: false
      label: "наедине с мыслями — и с кнопкой"
      value_beat: 2
      chips: ["Готовы платить, чтобы не получать удар"]
      chips_beat: 5
      src: "Wilson et al., 2014"

  - id: f61b
    template: day_fact
    lines:
      - "И всё же нажали | двенадцать мужчин из восемнадцати | и шесть женщин из двадцати четырёх."
      - "А один нажал сто девяносто раз — | его исключили из результатов."
    params:
      n: 61
      icon: bolt
      title: "И всё же — *нажимали*"
      title_beat: 0
      bars:
        - {label: "Мужчины", value: 67, text: "12 из 18", color: accent}
        - {label: "Женщины", value: 25, text: "6 из 24", color: dim}
      bars_beat: 1
      chips: ["Один — 190 нажатий, исключён"]
      chips_beat: 3
      src: "Wilson et al., 2014"

  - id: f62
    template: day_fact
    lines:
      - "Шестьдесят второй."
      - "Фантомную вибрацию телефона | ощущали восемьдесят девять процентов | опрошенных студентов"
      - "и шестьдесят восемь — | сотрудников больницы."
      - "Большинство это не тревожит."
    params:
      n: 62
      icon: phone
      title: "*Фантомная* вибрация"
      title_beat: 1
      bars:
        - {label: "Студенты", value: 89, text: "89%", color: accent}
        - {label: "Сотрудники больницы", value: 68, text: "68%", color: accent}
      bars_beat: 2
      chips: ["Большинство не тревожит"]
      chips_beat: 6
      src: "Drouin et al., 2012; Rothberg et al., 2010"

  - id: f63
    template: day_fact
    lines:
      - "Шестьдесят третий."
      - "Даже уведомление, | на которое вы не посмотрели,"
      - "в эксперименте ухудшало результат | в задаче на внимание."
    params:
      n: 63
      icon: bell
      title: "Отвлекает *даже непрочитанное*"
      title_beat: 1
      chips: ["Не посмотрели — а внимание хуже"]
      chips_beat: 3
      src: "Stothart et al., 2015"

  - id: f64
    template: day_myth
    lines:
      - "Шестьдесят четвёртый — проверка мифа."
      - "«Телефон на столе отъедает ум, | даже экраном вниз»."
      - "Исходная работа — | почти восемьсот участников,"
      - "но повторить её не удалось,"
      - "а свежий обзор исследований | нашёл в лучшем случае | слабый эффект на рабочую память."
      - "Вердикт: | почти не подтвердилось."
    params:
      n: 64
      myth: "«Телефон рядом *отъедает ум»*"
      chips: ["Исходно ≈800 участников", "Повторить не удалось", "Обзор: эффект слабый или нулевой"]
      chips_beat: 4
      verdict: "no"
      verdict_text: "ПОЧТИ НЕ ПОДТВЕРДИЛОСЬ"
      verdict_beat: 10
      src: "Ward et al., 2017; обзор 2024"

  - id: f65
    template: day_fact
    lines:
      - "Шестьдесят пятый."
      - "Знаменитый вывод: | «мы забываем то, | что рассчитываем найти в гугле» —"
      - "подтвердился лишь частично."
    params:
      n: 65
      icon: brain
      title: "*Эффект гугла* — наполовину"
      title_beat: 1
      chips: ["Повторные проверки — лишь частично"]
      chips_beat: 4
      src: "Sparrow et al., 2011"

  - id: f66
    template: day_fact
    lines:
      - "Шестьдесят шестой."
      - "Кто считал вечерний сериал | прокрастинацией,"
      - "чувствовал больше вины | и хуже восстанавливался."
    params:
      n: 66
      icon: play
      title: "Сериал *с чувством вины*"
      title_beat: 1
      chips: ["Больше вины", "Хуже отдых"]
      chips_beat: 3
      src: "Reinecke et al., 2014"

  - id: f67
    template: day_fact
    lines:
      - "Шестьдесят седьмой."
      - "Пересматривать любимое | обычно приятнее, чем мы ожидаем, —"
      - "в том числе потому, | что замечаем новое."
    params:
      n: 67
      icon: heart
      title: "Пересматривать — *приятнее*, чем кажется"
      title_beat: 1
      chips: ["Замечаем новое"]
      chips_beat: 4
      src: "O'Brien, 2019"

  - id: f68
    template: day_fact
    lines:
      - "Шестьдесят восьмой."
      - "Внутренние часы, похоже, | подкручивают голод к вечеру."
      - "В небольшом эксперименте пик был | около восьми вечера, | когда бы человек ни ел,"
      - "а тяга к сладкому и солёному | шла по тому же графику."
    params:
      n: 68
      icon: clock
      title: "Голод *по часам*"
      title_beat: 1
      value: "20:00"
      count: false
      label: "пик голода — по внутренним часам"
      value_beat: 4
      chips: ["Сладкое и солёное — туда же"]
      chips_beat: 6
      src: "Scheer et al., 2013"

  - id: f69
    template: day_fact
    lines:
      - "Шестьдесят девятый."
      - "Чтение с планшета перед сном | вместо бумажной книги —"
      - "почти на десять минут дольше | до засыпания."
      - "Правда, исследование небольшое, лабораторное."
    params:
      n: 69
      icon: book
      title: "Планшет — *засыпаем дольше*"
      title_beat: 1
      value: "+10 мин"
      count: false
      label: "до засыпания"
      value_beat: 3
      src: "Chang et al., 2015"

  - id: f70
    template: day_fact
    lines:
      - "Семидесятый."
      - "В одном исследовании | пассивный скроллинг ухудшал самочувствие."
      - "Но обзор сорока работ показал: | большинство этого не подтверждает."
    params:
      n: 70
      icon: phone
      title: "Скроллинг — *не главный злодей*"
      title_beat: 1
      chips: ["Одно исследование — вред", "Обзор 40 работ — в основном нет"]
      chips_beat: 2
      src: "Verduyn et al., 2015; Valkenburg et al., 2022"

  - id: s99
    template: day_statement
    lines:
      - "Телефон — на зарядку. | Пора спать."
    params:
      text: "Дальше — *отбой*"
      icon: hourglass
      at_beat: 1
