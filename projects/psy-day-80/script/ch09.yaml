chapter: ch09
title: "23:59 — Итоги дня"
scenes:
  - id: s00
    template: day_stop
    lines:
      - "Без одной минуты полночь."
      - "Итоги дня."
    params:
      facts: "80 фактов · 8 проверок"
      facts_beat: 1

  - id: s01
    template: day_statement
    lines:
      - "Если сложить восемьдесят фактов, | проступает один узор."
      - "Мозг не ломается — | он экономит:"
      - "меняет точность на скорость."
    params:
      text: "Не поломка — *экономия*"
      icon: brain
      sub: "мозг меняет точность на скорость"
      at_beat: 2

  - id: s02
    template: day_fact
    lines:
      - "У мифов тоже есть узор."
      - "Из восьми проверок | ни одна не подтвердилась целиком."
      - "Обычно в начале — | одно небольшое исследование,"
      - "а по дороге в ленту | теряются оговорки."
    params:
      n: null
      title: "Узор *мифов*"
      title_beat: 0
      value: "0 из 8"
      count: false
      label: "подтвердились целиком"
      value_beat: 2
      chips: ["Одно исследование — без оговорок"]
      chips_beat: 3

  - id: s03
    template: day_bullets
    lines:
      - "Что можно взять в завтра?"
      - "Почту — проверять три раза в день."
      - "За рулём — не говорить по телефону, даже с гарнитурой."
      - "А сегодня перед сном — | пять минут на список дел на завтра."
    params:
      header: "На завтра"
      items:
        - {icon: bell, text: "Почта — 3 раза в день"}
        - {icon: phone, text: "За рулём — без звонков, даже с гарнитурой"}
        - {icon: check, text: "Перед сном — 5 минут на список дел"}
      first_beat: 1

  - id: s04
    template: day_outro
    lines:
      - "И напоследок вопрос: | во сколько вы вчера собирались лечь —"
      - "и во сколько легли на самом деле?"
      - "Спокойной ночи."
    params:
      text: "Спокойной *ночи*"
      sub: "Во сколько вы вчера собирались лечь — и во сколько легли?"
