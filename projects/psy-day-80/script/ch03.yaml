chapter: ch03
title: "10:00 — Совещание"
scenes:
  - id: s00
    template: day_stop
    lines:
      - "Десять ноль-ноль."
      - "Остановка третья — совещание."
    params:
      facts: "факты 21–30"
      facts_beat: 1

  - id: f21
    template: day_fact
    lines:
      - "Двадцать первый."
      - "«Сколько займёт проект?» — | и тут мы ошибаемся."
      - "Студенты обещали сдать диплом примерно за тридцать четыре дня, | а в худшем случае — за сорок девять."
      - "Ушло пятьдесят шесть, | и в свой срок уложились меньше трети."
      - "Это ошибка планирования."
    params:
      n: 21
      icon: hourglass
      title: "Ошибка *планирования*"
      title_beat: 1
      bars:
        - {label: "Прогноз", value: 34, text: "34 дня", color: accent}
        - {label: "Худший случай", value: 49, text: "49 дней", color: dim}
        - {label: "На деле", value: 56, text: "56 дней", color: red}
      bars_beat: 3
      src: "Buehler, Griffin & Ross, 1994"

  - id: f22
    template: day_fact
    lines:
      - "Двадцать второй."
      - "Когда читают вслух по очереди, | хуже всего запоминается то, | что звучало прямо перед своей очередью | и сразу после."
      - "Провал — примерно девять секунд в обе стороны."
    params:
      n: 22
      title: "Перед своей очередью — *провал*"
      title_beat: 1
      value: "±9 с"
      count: false
      label: "вокруг своей очереди память проседает"
      value_beat: 5
      src: "Brenner, 1973"

  - id: f23
    template: day_fact
    lines:
      - "Двадцать третий."
      - "Что человек работает пекарем, | запомнить легче, чем что его фамилия Пекарь."
      - "Слово одно, | но мозг раскладывает его по разным полкам."
    params:
      n: 23
      icon: book
      title: "Профессия *запоминается лучше* фамилии"
      title_beat: 1
      chips: ["Работает пекарем — помнят", "Фамилия Пекарь — забывают"]
      chips_beat: 1
      src: "McWeeny et al., 1987"

  - id: f24
    template: day_fact
    lines:
      - "Двадцать четвёртый."
      - "После разговора с новым человеком | мы обычно недооцениваем, | насколько ему понравились."
      - "Это называют разрывом симпатии."
    params:
      n: 24
      icon: heart
      title: "Вы понравились *больше, чем думаете*"
      title_beat: 2
      chips: ["Разрыв симпатии"]
      chips_beat: 4
      src: "Boothby et al., 2018"

  - id: f25
    template: day_fact
    lines:
      - "Двадцать пятый."
      - "Волнение со стороны заметно меньше, чем кажется."
      - "Выступающие оценивали свою нервозность выше, | чем её видели слушатели."
    params:
      n: 25
      icon: eye
      title: "Волнение *не так заметно*"
      title_beat: 1
      chips: ["Изнутри — сильнее", "Со стороны — слабее"]
      chips_beat: 2
      src: "Savitsky & Gilovich, 2003"

  - id: f26
    template: day_myth
    lines:
      - "Двадцать шестой — проверка мифа."
      - "«Девяносто три процента общения — невербалика»."
      - "Цифра — из старых опытов с отдельными словами, | сказанными не с той интонацией."
      - "Сам Альберт Меграбян уточняет: | правило — только о разговорах о чувствах."
      - "В общем виде — | вердикт: | не подтвердилось."
    params:
      n: 26
      myth: "«93% общения — *невербалика»*"
      chips: ["Опыты: отдельные слова", "Автор: только о чувствах"]
      chips_beat: 3
      verdict: "no"
      verdict_beat: 8
      src: "Mehrabian & Wiener, 1967"

  - id: f27
    template: day_fact
    lines:
      - "Двадцать седьмой."
      - "Мозговой штурм: | четверо вместе выдали около тридцати двух идей, | а четверо по отдельности — около восьмидесяти четырёх на всех."
      - "Главная помеха — | ждать, пока дойдёт очередь говорить."
    params:
      n: 27
      icon: bolt
      title: "Штурм вместе — *меньше идей*"
      title_beat: 1
      bars:
        - {label: "Вместе", value: 32, text: "≈32", color: red}
        - {label: "Порознь", value: 84, text: "≈84", color: accent}
      bars_beat: 2
      chips: ["Помеха — ждать очереди"]
      chips_beat: 5
      src: "Diehl & Stroebe, 1987"

  - id: f28
    template: day_fact
    lines:
      - "Двадцать восьмой."
      - "Те, кто неделю проверял почту всего трижды в день, | отмечали меньше ежедневного стресса."
    params:
      n: 28
      title: "Почта трижды в день — *меньше стресса*"
      title_beat: 1
      value: "3"
      label: "проверки почты в день — всю неделю"
      value_beat: 1
      src: "Kushlev & Dunn, 2015"

  - id: f29
    template: day_fact
    lines:
      - "Двадцать девятый."
      - "«Двадцать три минуты, чтобы вернуться к делу после отвлечения»."
      - "Группа Глории Марк намерила около двадцати пяти минут, | и за это время человек успевал переключиться | ещё примерно на две задачи."
      - "А цифра двадцать три взялась из интервью."
    params:
      n: 29
      icon: clock
      title: "Отвлеклись — *вернуться долго*"
      title_beat: 2
      value: "~25 мин"
      count: false
      label: "до возврата — и ещё ≈2 задачи по пути"
      value_beat: 2
      chips: ["«23» — из интервью"]
      chips_beat: 5
      src: "Mark et al., 2005"

  - id: f30
    template: day_fact
    lines:
      - "Тридцатый."
      - "Говорят, незаконченное запоминается лучше."
      - "Но обзор почти вековой истории исследований | не нашёл надёжного преимущества."
      - "Зато к брошенным задачам | люди возвращаются примерно в двух случаях из трёх."
    params:
      n: 30
      icon: check
      title: "Незаконченное *не запоминается лучше*"
      title_beat: 2
      value: "2 из 3"
      count: false
      label: "к брошенным задачам возвращаются"
      value_beat: 5
      src: "Ghibellini & Meier, 2025"

  - id: s99
    template: day_statement
    lines:
      - "Если на совещаниях теперь станет чуть понятнее, | что творится у вас в голове, — | подпишитесь."
      - "Дальше обед, | и там мозг начинает очень странно считать деньги."
    params:
      text: "*Подпишитесь* — дальше обед"
      icon: bell
      at_beat: 2
