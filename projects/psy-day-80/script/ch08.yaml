chapter: ch08
title: "23:00 — Отбой"
scenes:
  - id: s00
    template: day_stop
    lines:
      - "Двадцать три ноль ноль."
      - "Остановка восьмая — отбой."
    params:
      facts: "факты 71–80"
      facts_beat: 1

  - id: f71
    template: day_fact
    lines:
      - "Семьдесят первый."
      - "Сидеть допоздна, | хотя ничто не держит, —"
      - "это «прокрастинация отхода ко сну»."
      - "В опросе она предсказывала недосып."
    params:
      n: 71
      icon: hourglass
      title: "*Прокрастинация* сна"
      title_beat: 3
      chips: ["Предсказывала недосып"]
      chips_beat: 4
      src: "Kroese et al., 2014"

  - id: q71
    template: day_statement
    lines:
      - "Кстати, вопрос к вам: | во сколько вы вчера собирались лечь —"
      - "и во сколько легли на самом деле? | Напишите в комментариях."
    params:
      text: "Собирались лечь — *а легли во сколько?*"
      icon: question
      at_beat: 1

  - id: f72
    template: day_fact
    lines:
      - "Семьдесят второй."
      - "Другой режим сна в выходные | тоже имеет название —"
      - "«социальный джетлаг»."
    params:
      n: 72
      icon: clock
      title: "*Социальный* джетлаг"
      title_beat: 3
      chips: ["Будни и выходные — разный сон"]
      chips_beat: 1
      src: "Wittmann et al., 2006"

  - id: f73
    template: day_fact
    lines:
      - "Семьдесят третий."
      - "Резкое «падение» при засыпании — | гипнический рывок."
      - "По оценкам, | его знает большинство людей."
    params:
      n: 73
      icon: bolt
      title: "*Гипнический* рывок"
      title_beat: 2
      chips: ["Знаком большинству"]
      chips_beat: 4
      src: "Oswald, 1959"

  - id: f74
    template: day_myth
    lines:
      - "Семьдесят четвёртый — проверка опровержения."
      - "«Наука доказала: | считать овец бесполезно»."
      - "Но в той оксфордской работе | овец нет вовсе, | а считали что-то лишь двое из четырнадцати."
      - "Нашли другое: | спокойная картинка в воображении | помогала при бессоннице | заснуть быстрее."
      - "Вердикт: | опровержение не подтвердилось."
    params:
      n: 74
      chip: "ПРОВЕРКА ОПРОВЕРЖЕНИЯ"
      myth: "«Считать овец — *бесполезно»*"
      chips: ["Овец в работе нет", "Считали двое из 14", "Помогла спокойная картинка"]
      chips_beat: 4
      verdict: "no"
      verdict_beat: 11
      src: "Harvey & Payne, 2002"

  - id: f75
    template: day_fact
    lines:
      - "Семьдесят пятый."
      - "Плохо спится в отеле | в первую ночь?"
      - "В Университете Брауна выяснили: | на новом месте | одно полушарие спит чутче"
      - "и сильнее реагирует | на незнакомые звуки."
    params:
      n: 75
      icon: brain
      title: "*Дежурное* полушарие"
      title_beat: 1
      chips: ["Новое место — одно полушарие начеку"]
      chips_beat: 5
      src: "Tamaki et al., 2016"

  - id: f75b
    template: day_fact
    lines:
      - "Больше восьмидесяти процентов | коротких пробуждений — | после звуков в ухо, связанное с ним."
      - "Ко второй ночи | эффект пропадает."
    params:
      n: 75
      icon: brain
      title: "Первая ночь — *на посту*"
      title_beat: 0
      value: ">80%"
      count: false
      label: "пробуждений — от «дежурного» уха"
      value_beat: 1
      chips: ["Вторая ночь — уже спокойнее"]
      chips_beat: 4
      src: "Tamaki et al., 2016"

  - id: f76
    template: day_fact
    lines:
      - "Семьдесят шестой."
      - "После бессонной ночи | люди хотели держать других | на большей дистанции,"
      - "а посторонние | оценивали их как более одиноких."
    params:
      n: 76
      icon: heart
      title: "Недосып *отдаляет*"
      title_beat: 1
      chips: ["Дистанция — больше", "Со стороны — одинокие"]
      chips_beat: 3
      src: "Ben Simon & Walker, 2018"

  - id: f77
    template: day_fact
    lines:
      - "Семьдесят седьмой."
      - "После примерно тридцати пяти часов без сна"
      - "эмоциональная «сигнализация» мозга | реагировала на неприятные картинки | больше чем на шестьдесят процентов сильнее."
      - "Исследование, правда, небольшое."
    params:
      n: 77
      icon: bell
      title: "*35 часов* без сна"
      title_beat: 1
      value: ">60%"
      count: false
      label: "сильнее реакция на неприятное"
      value_beat: 4
      chips: ["Небольшое исследование"]
      chips_beat: 5
      src: "Yoo et al., 2007"

  - id: f78
    template: day_fact
    lines:
      - "Семьдесят восьмой."
      - "Кто часто помнит сны, | обычно чаще просыпается ночью."
      - "Одно из объяснений: | чтобы сон сохранился в памяти, | нужно ненадолго проснуться."
    params:
      n: 78
      icon: eye
      title: "Помнят сны — *чаще просыпаются*"
      title_beat: 1
      chips: ["Чтобы запомнить сон — проснуться"]
      chips_beat: 4
      src: "Eichenlaub et al., 2014"

  - id: f79
    template: day_fact
    lines:
      - "Семьдесят девятый."
      - "«Утро вечера мудренее» | имеет опору."
      - "После ночного сна | скрытое упрощение в задаче | находили больше чем вдвое чаще,"
      - "но только те, | кто успел поработать над ней | до сна."
    params:
      n: 79
      icon: target
      title: "Утро вечера *мудренее*"
      title_beat: 1
      value: "×2+"
      count: false
      label: "чаще находили скрытый ход"
      value_beat: 5
      chips: ["Если думали над задачей до сна"]
      chips_beat: 6
      src: "Wagner et al., 2004"

  - id: f80
    template: day_fact
    lines:
      - "Восьмидесятый — последний."
      - "В лаборатории сна | те, кто пять минут писал список дел на завтра,"
      - "засыпали примерно на девять минут быстрее | тех, кто перечислял уже сделанное."
    params:
      n: 80
      icon: check
      title: "Список *на завтра*"
      title_beat: 1
      value: "−9 мин"
      count: false
      label: "до сна — у тех, кто писал планы"
      value_beat: 3
      src: "Scullin et al., 2018"

  - id: f80b
    template: day_fact
    lines:
      - "Чем конкретнее список, | тем быстрее сон:"
      - "план на бумаге — | и голова перестаёт его прокручивать."
    params:
      n: 80
      icon: check
      title: "План — *на бумагу*"
      title_beat: 0
      chips: ["Конкретнее — быстрее сон", "Голова не прокручивает"]
      chips_beat: 1
      src: "Scullin et al., 2018"

  - id: s99
    template: day_statement
    lines:
      - "Восемьдесят фактов позади. | Осталось сложить их вместе."
    params:
      text: "Дальше — *итоги дня*"
      icon: star
      at_beat: 1
