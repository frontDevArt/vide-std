chapter: ch01
title: "lab gallery"
scenes:
  - id: s01
    template: lab_chapter
    lines: ["Chapter one. | Wake up."]
    min_duration: 3
    params: {number: 1, total: 8, title: "Wake up", subtitle: "07:00 · facts 1–10"}
  - id: s02
    template: lab_versus
    lines: ["People say | willpower runs out like fuel.", "Large replications | found almost no effect."]
    params:
      chrome: {rubric: "Myth on Trial", number: "№ 08", steps: [CLAIM, EVIDENCE, VERDICT], step: 1}
      left: {title: "They say", items: [{text: "Willpower is a tank that runs dry", at: "willpower"}]}
      right: {title: "Studies found", items: [{text: "23 labs, 2141 people: effect near zero", at: "large"}, {text: "Belief about willpower matters more", at: "found"}]}
  - id: s03
    template: lab_flow
    lines: ["A habit forms in three steps: | a cue, | a routine, | and a reward."]
    params:
      chrome: {rubric: "Everyday Brain", number: "07:00", clock: "07:00"}
      stations:
        - {icon: alarm, title: "Cue", sub: "same time, same place", at: "cue"}
        - {icon: check, title: "Routine", sub: "the action itself", at: "routine"}
        - {icon: chart, title: "Reward", sub: "a small payoff", at: "reward"}
  - id: s04
    template: lab_diagram
    lines: ["Your phone on the desk | pulls on attention, | memory | and mood."]
    params:
      chrome: {clock: "21:15"}
      center: {icon: phone, title: "Phone on desk", at: "phone"}
      labels: [{text: "attention", at: "attention"}, {text: "memory", at: "memory"}, {text: "mood", at: "mood"}]
  - id: s05
    template: lab_full_number
    lines: ["Not twenty-one. | Sixty-six days."]
    params: {value: 66, caption: "median days", sub: "Lally et al., 2010", at: "sixty-six", myth: {value: 21, at: "not", strike_at: "twenty-one"},
             verdict: null, neuron: {mood: nod, at: "days", x: 1500, y: 700}}
