scenes:
  - id: s01
    template: lab.full_number
    min_duration: 3.5
    params: {value: 8, suffix: h, caption: "of sleep", sub: "what adults are told they need", at: "0.3s"}
  - id: s02
    template: media.image
    min_duration: 4.5
    params: {motion: parallax, zoom: [1.02, 1.12], pan: [[0.6, 0], [-0.6, 0]],
             layers: [{file: assets/bedroom-bg.png, depth: 0.15}, {file: assets/sleeper.png, depth: 1.0, fit: contain}],
             caption: "But sleep is *not* one block", caption_at: "0.8s"}
  - id: s03
    template: media.image
    min_duration: 4.0
    params: {file: assets/sleeper.png, fit: contain, box: [0.32, 0.08, 0.68, 0.78], zoom: [1.0, 1.06],
             kicker: "Cycles", caption: "Four to six *cycles* a night", caption_at: "0.5s"}
  - id: s04
    template: statement
    min_duration: 3.0
    params: {text: "Each cycle is about *90 minutes*", sub: "light → deep → REM"}
  # C5.1: раскладка Seedream (слои на холсте кадра по bounding_box) и вырезанные объекты nano-banana-2 / klein
  - id: s05
    template: media.image
    min_duration: 4.5
    params: {motion: parallax, zoom: [1.02, 1.12], pan: [[0.6, 0], [-0.6, 0]],
             layers: [{file: assets/room-empty.png, depth: 0.1}, {file: assets/room-layer2.png, depth: 0.7},
                      {file: assets/room-layer3.png, depth: 1.0}],
             caption: "Layers from *one* scene", caption_at: "0.5s"}
  - id: s06
    template: media.image
    min_duration: 3.0
    params: {file: assets/nb2-sleeper.png, fit: contain, box: [0.15, 0.2, 0.85, 0.75], zoom: [1.0, 1.0],
             kicker: "nano-banana-2", caption: "Cut out with *rembg*", caption_at: 0}
  - id: s07
    template: media.image
    min_duration: 3.0
    params: {file: assets/klein-sleeper.png, fit: contain, box: [0.15, 0.2, 0.85, 0.75], zoom: [1.0, 1.0],
             kicker: "flux-3 klein", caption: "Cut out with *rembg*", caption_at: 0}
