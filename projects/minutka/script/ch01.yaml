chapter: ch01
title: "Крючок и механика ленты"
scenes:
  - id: s01
    template: phone_lock
    lines:
      - "Зашёл проверить одно уведомление."
      - "Очнулся — прошёл час."
      - "Знакомо?"
    params:
      time_from: "21:04"
      time_to: "22:04"
      date: "вторник, 20 октября"
      notif_title: "Новое видео для тебя"
      notif_text: "Только посмотри одно…"
      badge: "+1 час"
      jump_beat: 1

  - id: s02
    template: phone_feed
    lines:
      - "У бесконечной ленты нет последней страницы."
    want_duration: 5.6
    params:
      swipe_every: 0.7

  - id: s03
    template: cards
    lines:
      - "Каждый свайп обещает что-то новое: | смешное видео, | неожиданную историю, | важную новость."
      - "Ты ещё не знаешь, что будет дальше, | и листаешь снова."
    params:
      first_beat: 1
      cards:
        - {icon: laugh, label: "Смешное видео", color: lime}
        - {icon: book, label: "Неожиданная история", color: amber}
        - {icon: news, label: "Важная новость", color: cyan}
        - {icon: question, label: "А что дальше?", color: magenta}
