# Студия Notes From The Mind (ROADMAP A1): англоязычный YouTube-канал, психология — мифы под проверкой.
# Правила — CLAUDE.md рядом; позиционирование — channel/POSITIONING.md; стиль — channel/STYLE.md (пресет lab).
# Секреты (ключ и голос ElevenLabs) — только в .env: свой studios/notes-from-the-mind/.env или корневой.
name: Notes From The Mind
kind: youtube              # youtube | brand | client
languages: [en]
platforms: [youtube, youtube-shorts]

# Настройки проекта по умолчанию: умолчания движка → defaults → project.yaml (project.yaml главнее).
# Схема — как у project.yaml (studio/config.py). Голос и модель входят в ключ кэша TTS — менять осознанно.
defaults:
  language: en
  format: horizontal
  tts:
    backend: elevenlabs
    voice: auto            # ELEVENLABS_VOICE_ID из .env
  style:
    palette: lab
  loudness: -14
  subtitles:
    size: 36
