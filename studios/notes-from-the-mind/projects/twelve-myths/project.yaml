# Бриф: briefs/twelve-myths.md (Myth on Trial, сборник 12 дел, ~60 мин — ROADMAP F2). Канал Notes From The Mind.
schema_version: 1
title: "12 Psychology Myths You Probably Still Believe"
topic: "Twelve famous 'facts' about the mind — what does the research actually say about each one?"
audience: >-
  Взрослые англоязычные зрители канала, без научной подготовки, смотрят долго и целиком. Вынести: многие
  «общеизвестные» факты о мозге — миф или сильное упрощение; как отличать (одно маленькое исследование ≠ доказано,
  связь ≠ причина, красиво ≠ правда); не стыдно, что верил — у каждого мифа есть причина жить.
kind: explainer
language: en
format: horizontal
platform: null
fps: 30
target_duration: null     # ~60 минут по речи (~9 300 слов); главы по ~4,5–5 мин

tts:
  backend: elevenlabs     # голос канала; ключ и голос — только в .env
  voice: auto             # ELEVENLABS_VOICE_ID
  rate: 100               # числом (как у канала; auto = повторный платный синтез)
  rate_range: [95, 115]

pauses:
  start: 0.45
  comma: 0.18
  sentence: 0.40
  scene: 0.55
  end: 0.6

style:
  palette: lab
  mood: lab               # общее настроение канала (ember и night были у прошлых роликов)
  font: Inter Display

images:
  enabled: true
  style: >-
    flat vector illustration, single object, centered, isolated on a plain flat light grey background #D9DDE3, limited palette
    #3DD6F5 cyan, #9B8CFF lavender, #EEF2F8 off-white, #111726 navy, soft rim light, clean shapes,
    no text, no letters, no numbers, no people's faces
  budget_usd: 3

music:
  enabled: true
  level_db: -14           # под голос ElevenLabs
  duck: true

sfx:
  enabled: true

subtitles:
  enabled: true
  max_lines: 1
  size: 36

loudness: -14

avoid:
  - "медицина и лечение: злость — бытовая, не «управление гневом»; без диагнозов"
  - "годы и авторы в речи — только в плашке источника и в описании (пожелание пользователя)"
  - "«science proved»"
  - "не больше ~7 слов в фокусе: подписи короткие, текст не дублирует озвучку (STYLE §3)"

done_means:
  - "12 дел — 12 вердиктов штампом; доска дел закрыта в финале"
  - "каждая цифра в кадре = источник = озвучка"
  - {final_hold: 1.5}

chapters: [ch01, ch02, ch03, ch04, ch05, ch06, ch07, ch08, ch09, ch10, ch11, ch12]

package:
  description: >-
    Twelve things almost everyone believes about the mind — from "let your anger out" to "opposites attract" —
    each one put on trial against the actual research. Some didn't survive. Some are half-true. All of them have a
    reason they keep spreading. Sources for every case are below.
  hashtags: [psychology, myths, science, brain, mythbusting]
  cover: {text: "12 MYTHS?", at: ch12/s13, verdict: none}
