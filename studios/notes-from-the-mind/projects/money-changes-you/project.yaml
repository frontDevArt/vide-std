    - "Li, W.-D., Yu, K., Yang, W., Zhang, Z., Zhang, X., Dormann, C., Zhang, H., & Zheng, Y. (2026). Do money and time change who you are? A continuous time meta-analysis and review of reciprocal relationships between personality traits and income. Psychological Bulletin. https://doi.org/10.1037/bul0000526"
    - "Piff, P. K., Stancato, D. M., Côté, S., Mendoza-Denton, R., & Keltner, D. (2012). Higher social class predicts increased unethical behavior. PNAS, 109(9), 4086–4091. https://doi.org/10.1073/pnas.1118373109"
