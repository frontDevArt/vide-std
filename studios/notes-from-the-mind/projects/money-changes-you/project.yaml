# Бриф: briefs/money-changes-you.md (Myth on Trial, deep-dive ~27 мин; радар 2026-W43 #10). Канал Notes From The Mind.
# Итоговый вердикт HALF-TRUE; подпункт «богатые злее/нечестнее» — MYTH (глава 3).
schema_version: 1
title: "Does Money Change You? What Researchers Actually Found"
topic: "Is it true that money changes people — that a raise or sudden wealth rewrites your personality?"
audience: >-
  Взрослые англоязычные зрители канала, работают и получают зарплату, без научной подготовки. Вынести: после роста
  дохода личность сдвигается, но крошечно (≤ 0,06 SD) и временно; «богатые злее» — громкие маленькие опыты, не
  повторившиеся на больших данных; связь двусторонняя — добросовестность и спокойствие сами ведут к росту дохода.
kind: explainer
language: en
format: horizontal
platform: youtube
fps: 30
target_duration: null     # ~27 минут по речи (~5 100 слов при замере ~190 слов/мин); 6 глав по 4–5 мин

tts:
  backend: elevenlabs     # голос канала; ключ и голос — только в .env
  voice: auto             # ELEVENLABS_VOICE_ID
  rate: 100               # числом, как у канала (auto = повторный платный синтез)
  rate_range: [95, 115]

pauses:
  start: 0.45
  comma: 0.18
  sentence: 0.40
  scene: 0.55
  end: 0.6

style:
  palette: lab
  mood: deep              # glow_cool #2BB3C9, glow_warm #6D7CFF, accent2 #A5C8FF (лёд) — холодный «измерительный» тон
  font: Inter Display

music:
  enabled: true
  level_db: -14           # под голос ElevenLabs
  duck: true

sfx:
  enabled: true

subtitles:
  enabled: true
  max_lines: 1
  size: 36

loudness: -14

avoid:
  - "реальные люди (знаменитости, миллиардеры, конкретные победители лотерей) — только учёные как авторы"
  - "медицина и диагнозы; политика неравенства и налогов"
  - "годы и авторы в речи — только в плашке источника и в описании (решение канала 2026-10-26)"
  - "«science proved», «science says»"
  - "не смешивать с темой «деньги и счастье» ($75 000) — одна фраза про лотерею и довольство жизнью"
  - "не больше ~7 слов в фокусе: подписи короткие, текст не дублирует озвучку (STYLE §3); подписи каналов пульта не считаются"

done_means:
  - "подвердикт MYTH (ch03) и итог HALF-TRUE (ch06) — словами и штампом"
  - "каждая цифра в кадре = источник = озвучка; все (?) из брифа закрыты до голоса главы"
  - "пульт личности (lab_mixer) проходит через весь ролик, состояние фейдеров — через state"
  - {final_hold: 1.5}

chapters: [ch01, ch02, ch03, ch04, ch05, ch06]

package:
  description: >-
    They say money changes people. One of the biggest analyses yet followed more than a hundred thousand working adults for
    up to twenty years to see what a raise really does to personality. We also cross-examine the famous studies
    claiming rich people are meaner — and what happened when others tried to repeat them. Verdict: HALF-TRUE.
    Sources for every claim are below.
  hashtags: [psychology, money, personality, science, mythbusting]
  cover: {text: "NEW YOU?", verdict: HALF-TRUE}   # как в утверждённом демо; auto взял бы первый (подвердикт MYTH ch03)
  sources:                # дополняется по главам: «Авторы (год). Название. Журнал. Ссылка»
