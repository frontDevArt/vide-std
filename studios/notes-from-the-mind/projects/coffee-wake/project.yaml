# Канал Notes From The Mind, Myth on Trial (короткий, ~2 мин — пробный ролик и материал для нарезки B4). Вердикт HALF-TRUE.
schema_version: 1
title: "Does Coffee Wake You Up? What the Research Says"
topic: "Is it true that your morning coffee makes you more alert — or does it just undo overnight withdrawal?"
audience: >-
  Взрослые англоязычные зрители канала, пьют кофе каждое утро, без научной подготовки. Вынести: утренний «заряд»
  у постоянных пьющих — в основном возврат к норме после ночной ломки (withdrawal reversal); у тех, кто пьёт редко,
  эффект есть, но небольшой; часть бодрости — ожидание (плацебо). Не медицинский совет — про поведение и ощущения.
language: en
format: horizontal
platform: null
fps: 30
target_duration: null     # ~2 минуты по речи (~300 слов)

tts:
  backend: elevenlabs     # голос канала; ключ и голос — только в .env
  voice: auto             # ELEVENLABS_VOICE_ID
  rate: 100               # числом (auto = повторный платный синтез)
  rate_range: [95, 115]

pauses:
  start: 0.45
  comma: 0.18
  sentence: 0.40
  scene: 0.55
  end: 0.6

style:
  palette: lab
  mood: night             # glow_cool #5B7CFF, accent2 #6D7CFF (индиго) — утро, усталость, режим
  font: Inter Display

music:
  enabled: true
  level_db: -14           # под голос ElevenLabs
  duck: true

sfx:
  enabled: true

subtitles:
  enabled: true
  max_lines: 1
  size: 36

loudness: -14

chapters: [ch01]

# Пакет к выходу (ROADMAP B5): `python -m studio package coffee-wake` → output/coffee-wake/
package:
  description: >-
    Does your morning coffee actually wake you up — or does it just undo the withdrawal from last night? We look at
    what the research found on habitual drinkers, rare drinkers and the placebo boost. Verdict: HALF-TRUE.
    Not medical advice.
  cover: {text: "WAKE UP?"}
  sources:
    - "Rogers, P. J., et al. (2010). Association of the anxiogenic and alerting effects of caffeine with ADORA2A and ADORA1 polymorphisms and habitual level of caffeine consumption. Neuropsychopharmacology, 35, 1973–1983."
    - "Juliano, L. M., & Griffiths, R. R. (2004). A critical review of caffeine withdrawal. Psychopharmacology, 176, 1–29."
    - "James, J. E., & Rogers, P. J. (2005). Effects of caffeine on performance and mood: withdrawal reversal is the most plausible explanation. Psychopharmacology, 182, 1–8."
    - "Haskell, C. F., Kennedy, D. O., Wesnes, K. A., & Scholey, A. B. (2005). Cognitive and mood improvements of caffeine in habitual consumers and habitual non-consumers of caffeine. Psychopharmacology, 179, 813–825."
    - "Dawkins, L., Shahzad, F.-Z., Ahmed, S. S., & Edmonds, C. J. (2011). Expectation of having consumed caffeine can improve performance and mood. Appetite, 57, 597–600."
