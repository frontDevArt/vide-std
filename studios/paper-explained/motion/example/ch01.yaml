#       играет перевод.
# m03 — «это было в телевизоре»: отъезд из экрана; один телевизор → поле телевизоров → точки, счётчик до 650 000 000,
#       счётчики-пилюли столбиком; в конце — нырок в экран (нырок в картинку).
# m04 — призыв действием: касание нажимает сердце и «Подписаться», кнопка становится «Вы подписаны».
