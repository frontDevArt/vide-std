# Демо моушн-приёмов (2026-11-16): шесть приёмов из разбора research/reference-timurka-fable-motion/README.md в
# вертикали 9:16. Не ролик для публикации: мини-сюжет «первые слова на Луне» выбран как бесплатный полигон — фраза и
# запись NASA в общественном достоянии, всё рисуется кодом (ни Kie, ни фото). Что показано и где — outline.md.
schema_version: 1
title: "Демо моушн-приёмов: первые слова на Луне"
topic: "Демо шести моушн-приёмов на мини-сюжете: в июле 1969 человек шагнул на Луну, сказал фразу про маленький шаг, прямой эфир смотрели 650 млн человек"
audience: "Пользователь студии: посмотреть приёмы в вертикали и выбрать, какие брать в ролики «На бумаге»"
kind: explainer
language: ru
format: vertical
platform: tiktok
fps: 30
target_duration: null

tts:
  backend: fake           # тон вместо речи: бесплатный черновик движения. Голос канала (ElevenLabs) — только после «да»
  voice: auto
  rate: 110               # только для fake. На голос канала: backend elevenlabs и rate: auto — студия даст v4 и 120
  rate_range: [98, 125]
  context: false

pauses:                   # правила студии: 0,42 / 0,6 с
  start: 0.2
  comma: 0.18
  sentence: 0.45
  scene: 0.6
  end: 0.8

style:
  palette: calm           # перекрыто бренд-китом студии; вид демо — «Лунная ночь» (assets/src/moon.css)
  font: Inter Display

music:
  enabled: false          # демо движения: без трека (трек канала — платная генерация)

sfx: {enabled: true, level_db: 6}

subtitles:
  enabled: true           # в .srt/.vtt; в кадре подписи рисует страница (paper_page)
  max_lines: 2

loudness: -14

chapters: [ch01]

package:
  ai_label: false

avoid:
  - {numbers_without_source: false}   # решение пользователя 2026-11-10: источников-плашек нет — факты сверены (outline.md)
done_means:
  - "Луна видна в каждой сцене и сама делает переходы (раскрытие, экран телевизора, фон призыва)"
  - "маркер идёт одновременно в оригинале и в переводе, в такт словам"
  - "один телевизор → поле телевизоров → точки, счётчик докручивается до 650 000 000"
  - "в призыве кнопки нажимаются сами и меняют состояние"
