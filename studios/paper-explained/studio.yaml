# Студия "Paper Explained" (ROADMAP A1, создана `python -m studio new-studio`, мастер — /new-studio).
# Правила — CLAUDE.md рядом; бренд-кит — brand/brand.yaml (docs/BRAND.md).
# Секреты (ключ и голос ElevenLabs) — только в .env студии: studios/paper-explained/.env (корневой .env — запасной).
name: "Paper Explained"
kind: youtube             # youtube | brand | client
languages: [ru]
platforms: [youtube-shorts, tiktok, instagram-reels, youtube]   # площадки: профили — python -m studio platforms (studio/platforms.py)

# Настройки проекта по умолчанию: умолчания движка → defaults → project.yaml (project.yaml главнее).
# Схема — как у project.yaml (studio/config.py). Голос и модель входят в ключ кэша TTS — менять осознанно.
defaults:
  language: ru
  format: vertical
  style:
    brand: brand           # бренд-кит brand/brand.yaml (ROADMAP A2)
  # images: {enabled: true, style: "…", budget_usd: 3}   # AI-картинки сцен (ROADMAP C5, docs/IMAGES.md), платно

# Голос студии по языку проекта: DEFAULTS → defaults → voices[язык] → project.yaml (ROADMAP A3, docs/TTS.md).
# env:ИМЯ — значение из .env студии (в git и чат не попадает). rate — числом после первого ролика.
voices:
  ru: {backend: elevenlabs, voice: env:ELEVENLABS_VOICE_ID, rate: 110}   # Artspace (Etagi), выбор пользователя 2026-11-09;
                          #   ID — в studios/paper-explained/.env, ключ API — корневой .env. Запасной офлайн: piper ru_RU-ruslan-medium
max_accents: 2             # переопределений голоса (voice: сцен/строк) на ролик без ⚠️

# Ворота качества (ROADMAP D4, studio/gates.py): правила для всех проектов студии, к ним — avoid / done_means
# проекта (одноимённое правило проекта главнее, `false` — выключить). Строка — пункт чек-листа «глазами» в qa.
quality: {avoid: [{numbers_without_source: true}]}
