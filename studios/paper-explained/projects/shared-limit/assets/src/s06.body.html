<!-- s06 — лечение 2: «Второе: | ползунок размышления — | не выше, чем нужно.»
     Идея: бумажный ползунок размышления Instant · Medium · High · Extra High; над делениями столбики «цены» растут
     слева направо, ручка стоит на Extra High и съезжает на Medium; пункт 2 пишется на листе.
     b0: ярлык (стоит с s05), ползунок; b1 «размышления»: столбики и «дороже →»; b2 «выше»: ручка едет, «нужно» —
     Medium подсвечен, галочка. -->
<style>
  .notch { position: absolute; top: 420px; font-family: PTMono; font-size: 30px; color: var(--navy); white-space: nowrap; transform: translateX(-50%); }
  .bar2 { position: absolute; width: 74px; bottom: 1020px; background: var(--grain), var(--terra); }
</style>
<div class="stage">
  <div class="kicker" style="left: 0; top: 0; animation: none">Лечение</div>
  <div class="dot" style="left: 690px; top: 110px; width: 60px; height: 60px; --d: .4s"></div>

  <!-- столбики «цены» -->
  <div class="bar2 growY" style="left: 33px; height: 26px; background: none; border: 3px dashed var(--olive); box-sizing: border-box" data-at="размышления"></div>
  <div class="bar2 growY" style="left: 233px; height: 90px" data-at="размышления:0.1"></div>
  <div class="bar2 growY" style="left: 433px; height: 170px" data-at="размышления:0.2"></div>
  <div class="bar2 growY" style="left: 623px; height: 260px; background: var(--grain), var(--terra-dk)" data-at="размышления:0.3"></div>
  <div class="abs hand appear" style="left: 190px; top: 70px; font-size: 64px; color: var(--terra-dk); --r: -6deg" data-at="размышления:0.5">дороже →</div>

  <!-- дорожка ползунка -->
  <div class="abs growX" style="left: 40px; top: 382px; width: 660px; height: 12px; background: var(--grain), var(--navy); --d: .2s; --dd: .4s"></div>
  <div class="abs mark growX" style="left: 200px; top: 412px; width: 140px; height: 44px; background: var(--mustard); mix-blend-mode: multiply; --dd: .25s" data-at="нужно"></div>
  <div class="notch appear" style="left: 70px; --d: .3s">Instant</div>
  <div class="notch appear" style="left: 270px; --d: .35s">Medium</div>
  <div class="notch appear" style="left: 470px; --d: .4s">High</div>
  <div class="notch appear" style="left: 660px; --d: .45s">Extra High</div>
  <!-- ручка: стоит на Extra High, на «выше» едет на Medium -->
  <div class="abs pop" style="left: 624px; top: 352px; --d: .3s">
    <div class="knob" style="--kx: -390px" data-at="выше" data-sfx="slide">
      <div class="shadow"><div style="width: 72px; height: 72px; border-radius: 50%; background: var(--grain), var(--tan); box-shadow: inset 0 0 0 7px var(--navy)"></div></div>
    </div>
  </div>

  <!--@sheet {"done": 1, "add": "ползунок", "tick": "нужно"}-->
</div>
