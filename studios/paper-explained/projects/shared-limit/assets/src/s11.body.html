<!-- s11 — обещание пользователя и подписка: «Если этот ролик наберёт сто пятьдесят лайков, | в следующем покажем, |
     как с плагинами и настройками | сэкономить ещё больше. | Подпишитесь, чтобы не пропустить.»
     Идея: сверху рукой «если ролик наберёт», сердце и цель «150» с полосой до флажка; посередине карточка следующего
     ролика («Ещё экономнее» — фишки «плагины», «настройки», подчёркнуто на «больше»); внизу карточка канала, рука
     указывает на «+ Подписаться».
     b0: «если» — надпись рукой, «сто» — 150, «лайков» — сердце, полоса; b1 «следующем»: карточка ролика; b2: фишки;
     b3 «больше»: подчёркивание; b4 «подпишитесь»: канал, рука, кнопка, галочка. -->
<style>
  .heart { width: 200px; height: 182px; background: var(--grain), var(--terra);
           clip-path: path('M100 180 C 38 134, 0 96, 0 54 A 50 50 0 0 1 100 35 A 50 50 0 0 1 200 54 C 200 96, 162 134, 100 180 Z'); }
  .next { box-sizing: border-box; width: 740px; padding: 22px 30px 26px; }
  .next small { display: block; font-family: PTMono; font-size: 24px; letter-spacing: 4px; color: var(--dim); text-transform: uppercase; }
  .next b { display: block; margin-top: 6px; font-family: Oswald; font-weight: 700; font-size: 84px; line-height: .95; color: var(--navy); text-transform: uppercase; }
  .chan { width: 520px; box-sizing: border-box; padding: 16px 22px; display: flex; align-items: center; gap: 22px; }
  .chan img { width: 116px; height: 116px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 4px var(--navy); flex: none; }
  .chan b { display: block; font-family: Oswald; font-weight: 700; font-size: 58px; line-height: .95; color: var(--navy); text-transform: uppercase; white-space: nowrap; }
  .chan small { display: block; margin-top: 8px; font-family: PTMono; font-size: 24px; color: var(--dim); }
  .follow { padding: 14px 28px 10px; font-family: Oswald; font-weight: 600; font-size: 50px; color: var(--paper-hi); background: var(--grain), var(--navy); white-space: nowrap; }
</style>
<div class="stage">
  <div class="cross" style="left: 700px; top: 250px; --d: .4s"></div>

  <!-- цель: 150 лайков -->
  <div class="abs hand appear" style="left: 236px; top: 0; font-size: 54px; --r: -2deg" data-at="если">если ролик наберёт</div>
  <div class="abs pop sticker" style="left: 0; top: 44px; --r: -6deg" data-at="лайков:-0.2" data-sfx="flick" data-boil><div class="heart"></div></div>
  <div class="abs num pop" style="left: 230px; top: 58px; font-size: 170px; --r: -2deg" data-at="сто">150</div>
  <div class="abs tanp" style="left: 230px; top: 214px; width: 480px; height: 32px; animation: appear .01s linear .3s both"></div>
  <div class="abs growX" style="left: 230px; top: 214px; width: 480px; height: 32px; background: var(--grain), var(--terra); --dd: 1.1s" data-at="лайков"></div>
  <svg class="ink" width="780" height="960"><g fill="none" stroke="#30353C" stroke-width="4" stroke-linecap="round">
    <path class="draw" pathLength="1" style="--dd: .2s" data-at="лайков:0.9" d="M722 256 L 722 168"/>
  </g></svg>
  <div class="abs pop" style="left: 724px; top: 168px; width: 46px; height: 34px; background: var(--grain), var(--olive); clip-path: polygon(0 0, 100% 50%, 0 100%)" data-at="лайков:1.05"></div>

  <!-- следующий ролик -->
  <div class="abs drop" style="left: 20px; top: 296px; --r: -1.5deg" data-at="следующем" data-boil=".6">
    <div class="shadow"><div class="sheet next" data-torn="tb" data-depth="7">
      <small>Следующий ролик</small><b>Ещё экономнее</b>
    </div></div>
  </div>
  <svg class="ink" width="780" height="960"><path class="draw" pathLength="1" stroke="#6F8A4E" stroke-width="9" fill="none" stroke-linecap="round"
       style="--dd: .35s" data-at="больше" d="M54 474 C 220 462, 420 466, 560 458"/></svg>
  <div class="abs pop tanp chip shadow" style="left: 70px; top: 506px; font-size: 40px; --r: -4deg" data-at="плагинами" data-boil>плагины</div>
  <div class="abs pop tanp chip shadow" style="left: 330px; top: 512px; font-size: 40px; --r: 3deg" data-at="настройками" data-boil>настройки</div>

  <!-- подписка -->
  <div class="abs slideL" style="left: 0; top: 620px; --r: -1deg" data-at="подпишитесь:-0.3" data-boil=".6">
    <div class="shadow"><div class="sheet chan" data-torn="b" data-depth="6">
      <img src="../../../brand/avatar/hand.png" alt="">
      <div><b>На бумаге</b><small>@nabumage.tv</small></div>
    </div></div>
  </div>
  <div class="abs slideL sticker" style="left: 0; top: 800px; width: 250px; height: 130px; --r: -3deg" data-at="подпишитесь" data-boil>
    <img data-cut="HAND" data-box="250 130">
  </div>
  <div class="abs pop shadow" style="left: 280px; top: 812px; --r: 2deg" data-at="подпишитесь:0.2" data-boil><div class="follow">+ Подписаться</div></div>
  <svg class="ink" width="780" height="960"><path class="draw" pathLength="1" stroke="#6F8A4E" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"
       style="--dd: .2s" data-at="пропустить" d="M680 920 L 704 946 L 752 888"/></svg>
</div>
