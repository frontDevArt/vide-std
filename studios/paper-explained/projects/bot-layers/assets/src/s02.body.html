<!-- s02 — обещание: «Так начинает почти каждая компания. | И почти каждая лечит это неправильно.»
     Идея: вывески разных компаний, у каждой свой бот (крошечный робот); вторым битом — «ЛЕЧИТ / НЕПРАВИЛЬНО», поперёк
     «лечит» крест-накрест шлёпаются пластыри — намёк на заплатки дальше. Башня (МОДЕЛЬ + Кузя) стоит как в конце s01.
     b0: вывески по словам «почти», «каждая», «компания»; b1: заголовок, пластыри. -->
<style>
  .shop { width: 236px; height: 80px; box-sizing: border-box; padding: 0 0 0 64px; display: flex; align-items: center; position: relative;
          font-family: Oswald; font-weight: 600; font-size: 34px; letter-spacing: 1px; color: var(--navy); text-transform: uppercase; }
  .shop .mini { position: absolute; left: 14px; top: 9px; width: 38px; height: 62px; }
  .plaster { width: 330px; height: 76px; border-radius: 38px; background: var(--grain), #E5C29C; position: relative;
             box-shadow: inset 0 0 0 2px rgba(120, 80, 40, .25); }
  .plaster::before { content: ''; position: absolute; left: 116px; right: 116px; top: 13px; bottom: 13px; border-radius: 6px;
                     background: var(--grain), #F4E4CE; box-shadow: inset 0 0 0 2px rgba(120, 80, 40, .14); }
  .plaster::after { content: ''; position: absolute; left: 26px; right: 26px; top: 16px; bottom: 16px;
                    background: radial-gradient(circle, rgba(120, 80, 40, .38) 2px, transparent 2.6px) 0 0 / 14px 14px;
                    -webkit-mask-image: linear-gradient(90deg, #000 0 30%, transparent 30% 70%, #000 70%);
                    mask-image: linear-gradient(90deg, #000 0 30%, transparent 30% 70%, #000 70%); }
</style>
<div class="stage">
  <div class="cross" style="left: 700px; top: 560px; --d: .4s"></div>
  <!--@tower {"kind": "patch", "n": 1}-->

  <!-- у каждой компании свой бот -->
  <div class="abs pop shadow" style="left: 0; top: 84px; --r: -2deg" data-at="почти" data-boil>
    <div class="shop" style="background: var(--grain), var(--terra); color: var(--paper-hi)"><span class="mini sticker"><img data-cut="ROBOT" data-box="38 62"></span>Корочка</div></div>
  <div class="abs pop shadow" style="left: 266px; top: 96px; --r: 2deg" data-at="почти:0.25" data-boil>
    <div class="shop sheet"><span class="mini sticker"><img data-cut="ROBOT" data-box="38 62"></span>Аптека</div></div>
  <div class="abs pop shadow" style="left: 532px; top: 82px; --r: -1.5deg" data-at="каждая" data-boil>
    <div class="shop tanp"><span class="mini sticker"><img data-cut="ROBOT" data-box="38 62"></span>Банк</div></div>
  <div class="abs pop shadow" style="left: 14px; top: 196px; --r: 1.5deg" data-at="каждая:0.22" data-boil>
    <div class="shop tanp"><span class="mini sticker"><img data-cut="ROBOT" data-box="38 62"></span>Отель</div></div>
  <div class="abs pop shadow" style="left: 280px; top: 206px; --r: -2.5deg" data-at="компания" data-boil>
    <div class="shop sheet"><span class="mini sticker"><img data-cut="ROBOT" data-box="38 62"></span>Фитнес</div></div>
  <div class="abs pop shadow" style="left: 540px; top: 194px; --r: 2deg" data-at="компания:0.22" data-boil>
    <div class="shop sheet"><span class="mini sticker"><img data-cut="ROBOT" data-box="38 62"></span>Школа</div></div>

  <!-- лечит неправильно -->
  <div class="title" style="left: -6px; top: 344px; font-size: 176px; color: var(--navy)" data-at="лечит">Лечит</div>
  <div class="title" style="left: -4px; top: 500px; font-size: 116px; color: var(--terra)" data-at="неправильно">неправильно</div>
  <div class="abs pop" style="left: 425px; top: 382px; --r: -18deg" data-at="неправильно:0.3" data-sfx="flick"><div class="plaster shadow"></div></div>
  <div class="abs pop" style="left: 425px; top: 382px; --r: 18deg" data-at="неправильно:0.45" data-sfx="flick"><div class="plaster shadow"></div></div>
</div>
