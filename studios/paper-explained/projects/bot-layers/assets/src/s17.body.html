<!-- s17 — вывод и вопрос: «Заплатки лечат симптомы. | Порядок лечит бота. | Ваш бот — на заплатках или на фундаменте? |
     Пишите в комментариях.»
     Идея: обе башни рядом (обложка ролика): слева кривая на скотче — штамп «ЗАПЛАТКИ», справа ровная на плите —
     синий штамп «ФУНДАМЕНТ»; сверху вопрос «НА ЗАПЛАТКАХ / ИЛИ НА ФУНДАМЕНТЕ?»; внизу — пустой комментарий с курсором.
     b0: левая башня, штамп; b1: правая башня, штамп; b2: вопрос; b3: комментарий. -->

  .cmt .caret { display: inline-block; width: 3px; height: 32px; margin-left: 4px; vertical-align: -5px; background: var(--ink); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
<div class="stage">
