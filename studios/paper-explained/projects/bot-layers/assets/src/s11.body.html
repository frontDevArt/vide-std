<!-- s11 — диагноз: «Это не лечение, а заплатки. | Каждый слой ставили после пожара, | а проверку — последней.»

     зачёркивается, поверх — штамп «ЗАПЛАТКИ». Посередине лента времени: восемь язычков пламени, после каждого падает
     коробка; последняя (проверка) обводится — «проверка — последней».
