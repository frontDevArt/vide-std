# Бриф ролика. Всё, что не указано, берётся из studio/config.py (SCHEMA → DEFAULTS) и defaults студии.
schema_version: 1
title: "Бот на нейросети — это восемь слоёв"
topic: "Почему бот компании на нейросети — не «модель с логотипом», а восемь слоёв: модель, системный промпт, RAG, MCP, доступ, защита, кэш и роутер, наблюдаемость с эвалами. Переделка понравившейся пользователю концепции чужого ролика (2026-11-10) — своя история, свой стиль"
audience: "Русскоязычные пользователи ИИ и разработчики, которым предлагают «прикрутить бота». Вынести: каждый слой закрывает конкретный провал (советует конкурентов → промпт; выдумывает → RAG; не умеет действовать → MCP; чужие данные → доступ; промпт-инъекция → защита; счёт → кэш и роутер; не видно, где сломалось → трейсы и эвалы), а правка промпта без эвалов ломает всё снова"
kind: explainer           # длительность по речи; цель ~2:00 (боль → заплатки ×8 → провал → лечение: те же слои в правильном порядке)
language: ru
format: vertical
platform: tiktok
fps: 30
target_duration: null     # по речи

tts:
  backend: elevenlabs     # голос студии Artspace (voices: в studio.yaml → .env студии)
  voice: auto
  rate: 110               # ElevenLabs — только числом (auto = несколько платных синтезов)
  rate_range: [98, 125]
  context: false          # без соседних строк: иначе обрывы на стыках (docs/LESSONS.md)

pauses:                   # как в правилах студии: 0,42 / 0,6 с
  start: 0.3
  comma: 0.18
  sentence: 0.42
  scene: 0.6
  end: 0.6

style:
  palette: neon           # перекрыто бренд-китом студии (defaults.style.brand)
  font: Inter Display

music:
  enabled: false          # студия: без музыки — бумажные звуки под движение
  level_db: -13
  duck: true

sfx: {enabled: true, level_db: 10}

subtitles:
  enabled: true           # в .srt/.vtt; в кадре подписи рисует страница (paper_page)
  max_lines: 2

loudness: -14             # профиль tiktok

chapters: [ch01]

# Картинки Kie: только предметы-вырезки без букв; текст, коробки, чаты, чеки и схемы — кодом (web.html).
images:
  enabled: true
  style: "Style: black and white editorial halftone cut-out, vintage magazine print, high contrast, visible halftone dots and ink imperfections, cleanly isolated subject with a thin white paper cut border, premium paper collage quality, flat even light. Isolated on a plain flat light grey background. No clutter, no text, no letters, no numbers, no logos, no watermark, no anime, no cartoon style, no CGI look, no glossy 3D rendering, no photorealistic background, no oversaturated colors, no distorted anatomy, no blurry details"   # brand/PROMPTS.md
  budget_usd: 1

package:
  title: "Бот на нейросети — это восемь слоёв: заплатки или фундамент"
  description: >-
    Пиццерия ставит на сайт бота Кузю, и первым же ответом он советует конкурента. Дальше — как почти везде:
    после каждого пожара новая заплатка, восемь слоёв, месяц работы — и одна правка промпта «повеселее» роняет
    всю башню. Настоящее лечение — те же восемь слоёв, но в другом порядке и на фундаменте из эвалов и трейсов:
    тогда та же правка ловится раньше клиентов.
    Ваш бот — на заплатках или на фундаменте? Пишите в комментариях.
  hashtags: [нейросети, ии, чатбот, rag, программирование]   # tiktok — не больше 5
  cover: {at: 113.2}        # s17 после «…или на фундаменте?»: обе башни, штампы ЗАПЛАТКИ / ФУНДАМЕНТ, вопрос (обложка из плана)
  ai_label: false           # решение студии (CLAUDE.md, 2026-11-10): коллаж и синтезированная озвучка под отметку не попадают
  # источников в подписи нет — решение пользователя 2026-11-10 (CLAUDE.md студии); ❌ пакета «источники обязательны» ожидаем

avoid:
  - {numbers_without_source: false}   # решение пользователя 2026-11-10: источников в кадре нет — факты сверены до ролика
  - "чужой ролик-образец: его текст, герои («Гений», «Облачко», Казахстан, Тимур), неон-фиолет, 3D-блоки серверов, светящаяся сфера, плашка «СЛОЁВ / ГЕНИЙ: ОК»"
  - "логотипы OpenAI / Anthropic и реальных пиццерий; конкурент — выдуманная «Пицца напротив»"
  - "хайп и крик; суммы и цифры, похожие на рыночные данные (суммы в кадре — только реплики выдуманной истории)"
  - "раскладки прошлых роликов: круг + заголовок поперёк + предмет (claude-limits), забег-полосы (fable-52), лотки и папка (skills-gemini-codex)"
done_means:
  - "формула канала: боль видна в первые секунды (чат) → заплатки «проблема за проблемой» → провал на восьмом слое → диагноз → настоящее лечение: те же слои в другом порядке на фундаменте эвалов и трейсов; финал — та же правка ловится, бот здоров"
  - "восемь слоёв названы и в кадре латиницей/по-русски, и в озвучке кириллицей; каждый — с провалом, который он закрывает"
  - "две башни коробок от пиццы под роботом Кузей: кривая на заплатках (растёт без скачков, падает в s10) и ровная на фундаменте"
  - "в финале — вопрос для комментариев и лайк с подпиской"
