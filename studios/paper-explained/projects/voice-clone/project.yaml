# Бриф ролика. Всё, что не указано, берётся из studio/config.py (SCHEMA → DEFAULTS) и defaults студии.
schema_version: 1
title: "Мошенник говорит вашим голосом"
topic: "Мошенники угоняют аккаунт по коду входа, склеивают нейросетью голос из ваших голосовых и просят у родных деньги: почему «прислушайтесь к голосу» не спасает и лечение на одном листе — вам и родителям"
audience: "Широкая русскоязычная аудитория TikTok (первый шаг канала за пределы IT, решение пользователя 2026-11-11): у всех есть родители и голосовые. Вынести: голос подделывают из ваших же записей и пишут с вашего аккаунта; вам — код входа никому и облачный пароль; родителям — перезвонить по номеру и кодовое слово. Переслать лист родителям"
kind: explainer           # длительность по речи; цель ~55 с
language: ru
format: vertical
platform: tiktok
fps: 30
target_duration: null

tts:
  backend: elevenlabs     # голос студии Artspace (voices: в studio.yaml → .env студии)
  voice: auto
  rate: 110               # ElevenLabs — только числом
  rate_range: [98, 125]
  context: false          # без соседних строк: иначе обрывы на стыках (docs/LESSONS.md)

pauses:                   # как в правилах студии: 0,42 / 0,6 с
  start: 0.3
  comma: 0.18
  sentence: 0.42
  scene: 0.6
  end: 0.6

style:
  palette: neon           # перекрыто бренд-китом студии (defaults.style.brand)
  font: Inter Display

music:
  enabled: false          # студия: без музыки — бумажные звуки под движение
  level_db: -13
  duck: true

sfx: {enabled: true, level_db: 10}

subtitles:
  enabled: true           # в .srt/.vtt; в кадре подписи рисует страница (paper_page)
  max_lines: 2

loudness: -14             # профиль tiktok

chapters: [ch01]

# Картинок Kie нет: всё кодом (телефон, голова-кукла, конверт, лист), вырезки бренда — ножницы, рука, самолётик.
images:
  enabled: false

# Пакет к загрузке в TikTok (`python -m studio package voice-clone`) — только если пользователь попросит.
package:
  title: "Мошенник говорит вашим голосом"
  description: >-
    Маме приходит голосовое вашим голосом — а вы его не записывали. Мошенники выманивают код входа («проголосуйте»,
    «заберите подарок»), угоняют аккаунт и склеивают нейросетью голос из ваших голосовых. Лист лечения: вам — код
    входа никому, даже «поддержке», и облачный пароль (Telegram: Настройки → Конфиденциальность → Облачный пароль);
    родителям — просят денег, перезвонить по номеру, а не в тот же чат, и кодовое слово семьи. Перешлите родителям.
  hashtags: [мошенники, нейросети, телеграм, безопасность, родители]   # tiktok: не больше 5
  cover: {at: 5.6}          # s01 после «Это ваш голос»: голосовое крупно и штамп «ВАШ ГОЛОС» (до «?!»)
  ai_label: false           # решение студии (CLAUDE.md, 2026-11-10): коллаж и синтезированная озвучка под отметку не попадают

avoid:
  - {numbers_without_source: false}   # решение пользователя 2026-11-10: источников в кадре нет — факты сверены до ролика
  - "хайп и крик, запугивание; логотипы Telegram/WhatsApp как свои"
  - "не утверждать: что подделку никогда не отличить (только «почти»), сколько секунд записи хватает, суммы и статистику без нужды; что облачный пароль спасает от всего"
  - "не копировать интерфейс мессенджеров: чат, телефон и настройки — бумажные, своими словами"
  - "раскладки прошлых роликов: круг + заголовок поперёк + предмет (claude-limits), забег-полосы (fable-52), три лотка (skills-gemini-codex), башня (bot-layers), стакан и лист снизу (shared-limit)"
done_means:
  - "формула канала: боль (голосовое вашим голосом) → почему (код входа → голосовые → клон) → привычный совет не спасает → лечение на одном листе (вам / родителям) → вылечено на том же случае"
  - "все пять новых движений из теста motion-test: камера в глубину, ножницы и скотч, говорящая вырезка, ксерокс, конверт с листом"
  - "призыв переслать лист родителям; вопрос в комментарии; лайк и подписка в финале"
