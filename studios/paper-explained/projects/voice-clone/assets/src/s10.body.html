<!-- s10 — призыв и вопрос: «Перешлите это родителям.» «А вам такое приходило?»
     Слева сложенный лист «маме и папе ♥» (изнанка листа из s06); на «перешлите» он гаснет, и с его места вылетает
     бумажный самолётик (вырезка бренда) вверх-вправо, за ним — тонкий след. Ниже — вопрос огромной типографикой:
     «А вам такое» и «приходило?» терракотой; под ним — «✎ расскажите в комментариях». -->
<div class="stage">
  <div class="cross" style="left: 0; top: 0; --d: .3s"></div>

  <div class="abs drop" style="left: 30px; top: 250px; --r: -5deg; --d: .05s" data-boil=".5">
    <div class="fadeTo" style="--to: 0" data-at="перешлите:0.15">
      <div class="shadow"><div style="width: 300px; height: 150px; display: flex; align-items: center; justify-content: center; background: var(--grain), #EFE6D2" data-torn="all" data-depth="5">
        <span class="hand" style="font-size: 56px; transform: rotate(-4deg)">маме и папе ♥</span></div></div>
    </div>
  </div>
  <svg class="ink" width="780" height="960"><path class="draw thin" pathLength="1" style="--dd: 1s; opacity: .5; stroke-dasharray: 1 1" data-at="перешлите:0.2"
       d="M190 330 C 300 300, 380 120, 520 140 C 620 154, 640 60, 760 10"/></svg>
  <div class="abs travel" style="left: 60px; top: 240px; width: 260px; height: 170px; --tx: 640px; --ty: -330px; --dd: 1.1s" data-at="перешлите:0.15" data-sfx="whoosh">
    <div class="sticker" style="position: absolute; inset: 0; transform: rotate(-12deg)"><img data-cut="PLANE" data-box="260 170"></div>
  </div>
  <div class="abs hand appear" style="left: 380px; top: 250px; font-size: 58px; color: var(--terra-dk); --r: -4deg" data-at="родителям">родителям ↗</div>

  <div class="title" style="left: -4px; top: 486px; font-size: 92px; color: var(--navy)" data-at="вам:-0.15">А вам такое</div>
  <div class="title" style="left: -6px; top: 590px; font-size: 140px; color: var(--terra-dk)" data-at="приходило:-0.1">приходило?</div>
  <div class="abs appear label" style="left: 0; top: 860px; font-size: 30px" data-at="приходило:0.4">✎ расскажите в комментариях</div>
  <svg class="ink" width="780" height="960"><path class="draw thin" pathLength="1" style="--dd: .4s" data-at="приходило:0.5" d="M0 912 L 560 912"/></svg>
</div>
