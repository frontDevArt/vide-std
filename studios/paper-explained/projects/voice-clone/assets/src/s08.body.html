<!-- s08 — лечение: родителям: «Родителям: | просят денег — | перезвонить по номеру, а не в чат.» «И кодовое слово семьи.»
     Лист — на месте (build.py), пункты 1–2 уже с галочками. На «перезвонить» пишется пункт 3; под листом — бумажная
     трубка и плашка «по номеру», рядом «в чат» зачёркнуто на «чат». На «кодовое» пишется пункт 4, справа облачко
     «* * *» — «только свои». -->

  <div class="title" style="left: -4px; top: -6px; font-size: 96px; color: var(--navy); animation: none">Лечение</div>
  <div class="cross" style="left: 700px; top: 0; animation: none"></div>
  <!--@sheet {"done": 2, "add": {"3": ["перезвонить", "чат:0.3"], "4": ["кодовое", "семьи:0.15"]}}-->

  <!-- трубка «по номеру», «в чат» — зачёркнуто -->

  </div>
  <div class="abs pop" style="left: 300px; top: 812px; --r: 3deg" data-at="чат:-0.15" data-boil=".5">
    <div class="shadow"><div class="tanp chip" style="font-size: 30px; padding: 12px 22px 10px">в тот же чат</div></div>
  </div>
  <svg class="ink" width="780" height="960"><path class="draw strike" pathLength="1" fill="none" stroke-linecap="round"

  <!-- кодовое слово -->

    <div class="shadow"><div class="sheet" style="padding: 12px 22px 8px; font-family: Oswald; font-weight: 700; font-size: 60px; letter-spacing: 6px; color: var(--terra-dk); border-radius: 26px">* * *</div></div>
  </div>

</div>
