# Бриф ролика. Всё, что не указано, берётся из studio/config.py (SCHEMA → DEFAULTS) и defaults студии.
# Тема пользователя 2026-11-14: пара руферов поднялась на шпиль Эмпайр-стейт-билдинг, теперь им светит тюрьма.
# Вид — «Живая бумага» (утверждён 2026-11-14, код — nvidia-huang/assets/src). Кадры пары — их Instagram + бодикам
# NYPD (решение пользователя 2026-11-14).
schema_version: 1
title: "Обручились на шпиле — теперь им грозит тюрьма"
topic: "Российские руферы Ангела Николау и Иван Кузнецов (Биркус) 1 июля 2026 залезли на шпиль Эмпайр-стейт-билдинг, развернули флаг и обручились; их задержал спецотряд NYPD. Три тяжкие статьи, до 7 лет по каждой. 12 ноября, по словам адвоката, сорвалась сделка о мелких проступках; прокуратура это отрицает. Главное — механизм: как они туда попали и почему тяжкая статья страшнее срока (виза → депортация → по словам адвоката, война)"
audience: "Русскоязычные зрители канала «На бумаге» и шире — все, кто видел ролики про эту пару. Вынести: как они попали наверх (шаги), что им грозит и почему главная угроза — не тюрьма, а депортация"
kind: explainer           # длительность по речи; nvidia-huang v2 — 94,6 с и лучший старт после хита
language: ru
format: vertical
platform: tiktok
fps: 30
target_duration: null

tts:
  backend: elevenlabs     # голос студии Artspace; синтез — только после «да» пользователя (voice --yes)
  voice: auto
  rate: 110               # ElevenLabs — только числом
  rate_range: [98, 125]
  context: false          # без соседних строк: иначе обрывы на стыках (docs/LESSONS.md)

pauses:                   # правила студии: 0,42 / 0,6 с; старт короче — крючок с первого кадра
  start: 0.2
  comma: 0.18
  sentence: 0.42
  scene: 0.6
  end: 0.6

style:
  palette: neon           # перекрыто бренд-китом студии (defaults.style.brand)
  font: Inter Display

music:
  enabled: false          # студия: без музыки — бумажные звуки под движение
  level_db: -13
  duck: true

sfx: {enabled: true, level_db: 10}

subtitles:
  enabled: true           # в .srt/.vtt; в кадре подписи рисует страница (paper_page)
  max_lines: 2

loudness: -14             # профиль tiktok

chapters: [ch01]

images:
  enabled: false          # Kie — только по «да» пользователя (предметы: замок, люк, кольцо); пока всё кодом

package:
  title: "Обручились на шпиле — теперь им грозит тюрьма"
  description: >-
    Обручились на шпиле Empire State Building — а теперь им грозит тюрьма и высылка в Россию. Как они туда
    попали и почему для них это страшнее срока. А вы как думаете: искусство или преступление?
    Фото: Instagram @angela_nikolau. Видео: NYPD / AP.
  hashtags: [руферы, нью-йорк, новости, суд, любовь]   # tiktok: не больше 5
  cover: {at: 4.75}         # s01: решётка «тюрьма» упала на их фото со шпиля
  ai_label: false         # коллаж и синтезированная озвучка; настоящие кадры пары — их собственные, не сгенерированы

avoid:
  - {numbers_without_source: false}   # решение пользователя 2026-11-10: источников-плашек нет — факты сверены (outline.md)
  - "«20 лет» — нет: сумма статей; говорим «до семи лет по каждой»"
  - "отзыв сделки — версия адвоката, прокуратура отрицает: одна оговорка; «война» — только «говорит адвокат»"
  - "сгенерированных людей нет: лица пары — только их настоящие кадры"
  - "смакование, крик, оценка «преступники/герои» от автора — вопрос задаём зрителю"
done_means:
  - "крючок к 3 с: предложение на шпиле + «теперь им грозит тюрьма», пара крупно с первого кадра"
  - "механизм шагами: билет → ночь внутри → люк на 102-м → замок на 104-м → шпиль"
  - "бодикам NYPD — отрывок 3–5 с в бумажной рамке"
  - "поворот «Теперь главное: почему это страшнее тюрьмы» → виза → депортация"
  - "картинка меняется каждые 1–2 с; главное — по центру, левее кнопок TikTok"
  - "вопрос «искусство или преступление?» + лайк и подписка в финале"
