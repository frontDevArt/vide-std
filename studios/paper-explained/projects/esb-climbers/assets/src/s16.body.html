<!-- s16 — приглушённый синий (что дальше). «А вы как думаете: | искусство | или преступление?»
     С кадра 0 — две бумажные чаши-карточки качаются, как весы, «?» между ними; «искусство» — левая: их фото с флагом
     и ярлык «ИСКУССТВО»; «преступление» — правая: сломанный замок и ярлык «ПРЕСТУПЛЕНИЕ»; «думаете» — мелом «пишите
     в комментариях ↓». -->
<div data-backdrop class="sheetbg still dark" style="--c: var(--blue)"></div>
<div class="stage">
  <div class="scene"><div class="kick" style="--kx: 390px; --ky: 500px" data-at="преступление:-0.1"><div class="dive2" style="--ox: 390px; --oy: 500px">
    <!--@scraps-->
    <div class="beam" style="left: 60px; top: 120px; width: 660px; --d: 0s"></div>
    <div class="abs" style="left: 380px; top: 100px; width: 22px; height: 60px; background: var(--grain), var(--paper-hi)"></div>
    <div class="swingL" style="position: absolute; left: 0; top: 0; width: 780px; height: 1180px; --d: 0s">
      <div class="abs" style="left: 190px; top: 130px; width: 4px; height: 90px; background: var(--paper-hi)"></div>
      <div class="abs shadow pop" style="left: 20px; top: 210px; --r: -4deg; --d: .1s">
        <div class="sheet" data-torn="b" data-depth="6" style="width: 320px; height: 470px; position: relative; display: flex; align-items: center; justify-content: center">
          <div class="print pop" style="left: 20px; top: 20px; width: 280px; height: 330px" data-at="искусство:-0.2"><img src="people/ig/flag-heli.jpg" alt=""></div>
          <b class="pop" style="position: absolute; bottom: 30px; font-family: Oswald; font-size: 50px; color: var(--navy); text-transform: uppercase" data-at="искусство:-0.1">Искусство</b>
        </div>
      </div>
    </div>
    <div class="swingR" style="position: absolute; left: 0; top: 0; width: 780px; height: 1180px; --d: 0s">
      <div class="abs" style="left: 560px; top: 130px; width: 4px; height: 90px; background: var(--paper-hi)"></div>
      <div class="abs shadow pop" style="left: 390px; top: 210px; --r: 4deg; --d: .2s">
        <div class="sheet" data-torn="b" data-depth="6" style="width: 320px; height: 470px; position: relative; display: flex; align-items: center; justify-content: center">
          <svg class="abs pop" width="230" height="270" viewBox="0 0 320 380" style="left: 45px; top: 50px" data-at="преступление:-0.25">
            <path d="M80 170 V 100 a80 80 0 0 1 160 0" fill="none" stroke="#5D646C" stroke-width="30"/><rect x="20" y="160" width="280" height="210" rx="20" fill="#A9503F"/>
          </svg>
          <b class="pop" style="position: absolute; bottom: 30px; font-family: Oswald; font-size: 38px; color: var(--terra-dk); text-transform: uppercase" data-at="преступление:-0.1">Преступление</b>
        </div>
      </div>
    </div>
    <div class="abs chalkt pop" style="left: 320px; top: 660px; font-size: 180px; --r: 6deg; --d: .3s">?</div>
    <div class="abs chalkt appear" style="left: 60px; top: 880px; font-size: 70px; --r: -3deg" data-at="думаете:0.1">пишите в комментариях ↓</div>
  </div></div></div>
</div>
