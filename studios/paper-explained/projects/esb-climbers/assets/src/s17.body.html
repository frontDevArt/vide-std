<!-- s17 — кремовый лист въезжает снизу (призыв). «Если было полезно, | поставьте лайк | и подпишитесь.»
     Как финал nvidia-huang: «было полезно?» рукой; «лайк» — сердце; «подпишитесь» — карточка канала «На бумаге», рука на
     «+ Подписаться», галочка. Без нырка — финал ролика. -->
<div data-backdrop class="sheetbg" style="--c: var(--paper)"></div>
<div class="stage">
  <div class="scene">
    <!--@scraps-->
    <div class="abs hand appear" style="left: 30px; top: 60px; font-size: 110px; --r: -3deg" data-at="полезно:-0.15">было<br>полезно?</div>
    <div class="abs pop sticker" style="left: 420px; top: 120px; --r: -8deg" data-at="лайк:-0.15" data-sfx="flick" data-boil><div class="heart"></div></div>
    <div class="abs slideL" style="left: 20px; top: 520px; --r: -1deg" data-at="подпишитесь:-0.35" data-boil=".6">
      <div class="shadow"><div class="sheet chan" data-torn="b" data-depth="6">
        <img src="../../../brand/avatar/hand.png" alt="">
        <div><b>На бумаге</b><small>@nabumage.tv</small></div>
      </div></div>
    </div>
    <div class="abs slideL sticker" style="left: 20px; top: 760px; width: 270px; height: 140px; --r: -3deg" data-at="подпишитесь:-0.1" data-boil>
      <img data-cut="HAND" data-box="270 140">
    </div>
    <div class="abs pop shadow" style="left: 300px; top: 770px; --r: 2deg" data-at="подпишитесь:0.15" data-boil><div class="follow" style="font-size: 64px">+ Подписаться</div></div>
    <svg class="ink" width="780" height="1180"><path class="draw" pathLength="1" stroke="#6F8A4E" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"
         style="--dd: .2s" data-at="подпишитесь:0.75" d="M610 930 L 634 956 L 682 898"/></svg>
  </div>
</div>
