  - {file: assets/music/a-d1409c33.mp3, source: 'ElevenLabs Music API music_v2_5, сгенерировано 2026-11-15, song-id M829XgNrrIGst2sGVDmQ', license: 'ElevenLabs Eleven Music: коммерческое использование на платном тарифе (elevenlabs.io/music-terms), тариф starter', by: генерация, prompt: 'Instrumental retro synthwave for a fun short video about a hyped open-world crime game release. Neon Miami night-drive mood, 1980s analog synths with modern punchy production. 104 BPM, A minor, steady driving groove from the very first second with no slow intro: four-on-the-floor kick, tight gated-reverb snare, pulsing eighth-note analog bassline, warm detuned saw pads, sparkling arpeggios panned wide. Playful, confident and a little cheeky, not dark. Constant energy throughout with no breakdown, no drop and no tempo change, so a narrator can talk over it the whole time. Uncluttered midrange: no lead melody in the center, no vocals, no choir, no vocal chops. Ends with a clean final hit and a short reverb tail exactly at the end.', model: music_v2_5, seconds: 75.0, credits: 1125}
  - {file: assets/music/b-53943d01.mp3, source: 'ElevenLabs Music API music_v2_5, сгенерировано 2026-11-15, song-id P9shQp67V2NtaoIjwLs4', license: 'ElevenLabs Eleven Music: коммерческое использование на платном тарифе (elevenlabs.io/music-terms), тариф starter', by: генерация, prompt: 'Instrumental modern nu-disco and retro funk for a playful short video about a hyped open-world crime game set in sunny Florida. Groovy synth bass, crisp disco hi-hats, tight claps on two and four, glossy 80s electric piano stabs and short synth brass hits, sunset beach-party mood with a wink. 112 BPM, steady groove from the very first second with no intro build, constant energy with no breakdown or drop, so a narrator can talk over it the whole time. Sparse midrange: no lead melody in the center, no vocals, no choir, no vocal chops. Ends with a clean final hit exactly at the end.', model: music_v2_5, seconds: 75.0, credits: 1125}
