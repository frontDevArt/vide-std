     (1:04) справа; «показали» — «=» и «ПОХОЖ?», наезд на оба лица. 2-я фраза: сравнение уезжает наверх, «требовал» —
     звёзды розыска, «rockstar» — логотип, «пять» — зелёные «$5 000 000». 3-я: «попросил» — карточка «Кастинг · роль»,
