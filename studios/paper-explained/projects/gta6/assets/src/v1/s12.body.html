<!-- s12 — закатный лист въезжает снизу (вопрос). «А вы отпросились | на девятнадцатое?»
     С кадра 0 — пустой бланк заявления с ручкой-рукой; «вы» — огромное «А вы?» рукой розовым; «девятнадцатое» — листок 19. -->
<div data-backdrop class="sheetbg" style="--c: var(--sunset)"></div>
<div class="stage">
  <div class="scene"><div class="kick" style="--kx: 390px; --ky: 300px" data-at="вы:-0.05"><div class="dive2" style="--ox: 390px; --oy: 600px">
    <!--@scraps-->
    <!--@palm -150 700 520-->
    <div class="abs drop" style="left: 50px; top: 340px; --r: -2deg; --d: 0s">
      <div class="zayav" style="width: 670px">
        <div class="to">Директору<br>от: ____________</div>
        <div class="ttl">ЗАЯВЛЕНИЕ</div>
        <div class="tx">Прошу предоставить отгул ____ ноября в&nbsp;связи с&nbsp;…</div>
        <div class="sg"><span>дата</span><span>подпись</span></div>
      </div>
    </div>
    <div class="abs hand pop" style="left: 60px; top: 20px; font-size: 230px; color: var(--vc-pink); text-shadow: -6px 5px 0 rgba(47, 169, 176, .85); --r: -4deg" data-at="вы:-0.15">А вы?</div>
    <div class="dayp pop" style="left: 560px; top: 30px; transform-origin: 0 0; scale: 1.35; --r: 8deg" data-at="девятнадцатое:-0.15"><i>НОЯ</i><b>19</b><small>отгул?</small></div>
    <div class="abs slideL sticker" style="left: 420px; top: 860px; width: 300px; height: 160px; --r: -150deg" data-at="отпросились:0"><img data-cut="HAND" data-box="300 160"></div>
  </div></div></div>
</div>
