<!-- s10 — морской лист въезжает справа (что сделать вам). «Если тоже берёте отгул, | сделайте сегодня одно.»
     «Игра весит | до двухсот двенадцати гигабайт.» «Освободите место | и включите предзагрузку, | она уже открыта.»
     С кадра 0 — лист «Сделать сегодня» с пустыми клетками и листок «СЕГОДНЯ»; «игра» — «212 ГБ» рисографом;
     «весит» — шкала диска PS5 дорастает розовым; «место» — галочка 1; «предзагрузку» — галочка 2; «открыта» — лента. -->
<div data-backdrop class="sheetbg sea fromR" style="--c: var(--sea)"></div>
<div class="stage">
  <div class="scene"><div class="kick" style="--kx: 390px; --ky: 200px" data-at="двухсот:-0.05"><div class="dive2" style="--ox: 390px; --oy: 860px">
    <!--@scraps-->
    <!--@palm -150 700 520 #3A1D57-->
    <div class="riso on-sea pop" style="left: 40px; top: 10px; font-size: 230px; --d: 99s" data-at="игра:-0.1">212<small> ГБ</small></div>
    <div class="dayp pop" style="left: 560px; top: 20px; transform-origin: 0 0; scale: 1.3; --r: 6deg; --d: .1s"><i>СЕГОДНЯ</i><b>14</b><small>ноября</small></div>
    <div class="disk drop" style="left: 30px; top: 250px; width: 700px; --r: -1deg" data-at="весит:-0.2">
      <div class="hd"><span>PS5 · диск</span><span>свободно 667 ГБ</span></div>
      <div class="bar" style="height: 100px"><i class="growX" style="--w: 32%; --dd: .6s" data-at="двенадцати:-0.1"></i><b class="appear" style="font-size: 44px" data-at="гигабайт:-0.1">GTA 6</b></div>
    </div>
    <div class="abs drop" style="left: 30px; top: 510px; --r: 1deg; --d: 0s">
      <div class="todo2" style="width: 700px">
        <div class="hd">Сделать сегодня</div>
        <div class="it"><span class="cb"></span>освободить место
          <svg viewBox="0 0 84 84"><path class="draw" pathLength="1" style="--dd: .25s" data-at="место:-0.05" d="M14 44 L 34 66 L 76 10"/></svg></div>
        <div class="it"><span class="cb"></span>включить предзагрузку
          <svg viewBox="0 0 84 84"><path class="draw" pathLength="1" style="--dd: .25s" data-at="предзагрузку:0.1" d="M14 44 L 34 66 L 76 10"/></svg></div>
      </div>
    </div>
    <div class="abs shadow pop" style="left: 300px; top: 860px; --r: -3deg" data-at="уже:-0.15"><div class="flag vc" style="font-size: 52px">уже открыта</div></div>
  </div></div></div>
</div>
