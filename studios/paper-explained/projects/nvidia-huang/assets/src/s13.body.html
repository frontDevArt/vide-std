<!-- s13 — приглушённый синий (лист лежит). «Если они догонят, | вычисления подешевеют.» «А с ними | и нейросети | для нас.»
     С кадра 0 — гонка: три бумажные полосы с логотипами Nvidia / Google / AMD; на «догонят» полосы Google и AMD
     дотягиваются до Nvidia. «подешевеют» — ценник «цена вычислений», мелом стрелка вниз. Вторая фраза: гонка уходит
     вверх, жетоны ChatGPT / Claude / Gemini с ценниками «дешевле ↓», на «нас» — рука показывает на зрителя. -->
<div data-backdrop class="sheetbg dark still" style="--c: var(--blue)"></div>
<div class="stage">
  <div class="scene"><div class="kick" style="--kx: 390px; --ky: 640px" data-at="подешевеют:-0.1"><div class="dive2" style="--ox: 390px; --oy: 800px">
    <!--@scraps-->
    <div class="grp fadeTo" style=" --to: 0" data-at="нейросети:-0.3">
      <div class="lane" style="left: 20px; top: 40px; height: 150px"><div class="bar2 growX" style="width: 650px; height: 128px; --dd: .5s; --d: .05s"></div><img src="logos/nvidia.svg" alt="" style="height: 72px; left: 30px"></div>
      <div class="lane" style="left: 20px; top: 200px; height: 150px"><div class="bar2 fillTo" style="width: 650px; height: 128px; --from: .45; --dd: .6s" data-at="догонят:-0.1"></div><img src="logos/google.svg" alt="" style="height: 66px; left: 30px"></div>
      <div class="lane" style="left: 20px; top: 360px; height: 150px"><div class="bar2 fillTo" style="width: 650px; height: 128px; --from: .38; --dd: .6s" data-at="догонят:0.05"></div><img src="logos/amd.svg" alt="" style="height: 52px; left: 30px"></div>
      <svg class="ink" width="780" height="1180"><path class="draw chalk" pathLength="1" style="--dd: .4s" data-at="подешевеют:0" d="M560 600 L 590 840 M545 790 L 590 850 L 640 795"/></svg>
      <div class="tag pop" style="left: 30px; top: 580px; font-size: 84px; --r: -4deg" data-at="вычисления:-0.1">цена<br>вычислений</div>
      <div class="abs chalkt pop" style="left: 430px; top: 860px; font-size: 110px; --r: -3deg" data-at="подешевеют:0.2">ниже</div>
    </div>

    <div class="token pop" style="left: 20px; top: 120px; --sz: 200px; --r: -5deg" data-at="нейросети:-0.1"><div class="c"><img src="logos/chatgpt.svg"></div></div>
    <div class="token pop" style="left: 290px; top: 90px; --sz: 200px; --r: 3deg" data-at="нейросети:0.05"><div class="c"><img src="logos/claude.svg"></div></div>
    <div class="token pop" style="left: 510px; top: 120px; --sz: 200px; --r: -2deg" data-at="нейросети:0.2"><div class="c"><img src="logos/gemini.svg"></div></div>
    <div class="tag pop" style="left: 60px; top: 380px; font-size: 92px; --r: -3deg" data-at="нейросети:0.4">дешевле ↓</div>
    <div class="abs chalkt write" style="left: 120px; top: 640px; font-size: 140px; --dd: .4s" data-at="нас:-0.25" data-sfx="marker">для нас</div>
    <div class="abs pop sticker" style="left: 380px; top: 860px; width: 320px; height: 170px; --r: 160deg" data-at="нас:-0.1">
      <img data-cut="HAND" data-box="340 180">
    </div>
  </div></div></div>
</div>
