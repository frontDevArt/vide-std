<!-- s15 — кремовый лист въезжает снизу (призыв). «Сохраните, | чтобы не потерять.» «Если было полезно — | поставьте
     лайк | и подпишитесь.»
     С кадра 0 — бумажная закладка крупно, на «сохраните» — плашка «Сохранено» прихлопывается скотчем, рука показывает.
     Вторая фраза: закладка уменьшается в угол; «полезно» — рукой «было полезно?»; «лайк» — сердце; «подпишитесь» —
     карточка канала «На бумаге», рука на «+ Подписаться», галочка. Без нырка в конце — финал ролика. -->
<div data-backdrop class="sheetbg" style="--c: var(--paper)"></div>
<div class="stage">
  <div class="scene">
    <!--@scraps-->
    <div class="grp toShot" style=" --tx: 250px; --ty: -10px; --s1: .45; --r: 0deg; --dd: .45s; transform-origin: 390px 300px" data-at="если:-0.2">
      <div class="abs sticker pop" style="left: 240px; top: 60px; --r: -3deg; --d: .05s"><div class="bookmark"></div></div>
      <div class="abs shadow pop" style="left: 110px; top: 360px; --r: -5deg" data-at="сохраните:-0.05"><div class="saved sheet">Сохранено</div></div>
      <div class="tape" style="left: 80px; top: 320px; width: 56px; height: 90px; --r: 35deg" data-at="сохраните:0.15"></div>
      <div class="abs slideL sticker" style="left: 20px; top: 500px; width: 320px; height: 170px; --r: -20deg" data-at="потерять:-0.2"><img data-cut="HAND" data-box="320 170"></div>
    </div>

    <div class="abs hand appear" style="left: 30px; top: 60px; font-size: 104px; --r: -3deg" data-at="полезно:-0.15">было<br>полезно?</div>
    <div class="abs pop sticker" style="left: 60px; top: 330px; --r: -8deg" data-at="лайк:-0.15" data-sfx="flick" data-boil><div class="heart"></div></div>

    <div class="abs slideL" style="left: 20px; top: 620px; --r: -1deg" data-at="подпишитесь:-0.35" data-boil=".6">
      <div class="shadow"><div class="sheet chan" data-torn="b" data-depth="6">
        <img src="../../../brand/avatar/hand.png" alt="">
        <div><b>На бумаге</b><small>@nabumage.tv</small></div>
      </div></div>
    </div>
    <div class="abs slideL sticker" style="left: 20px; top: 860px; width: 270px; height: 140px; --r: -3deg" data-at="подпишитесь:-0.1" data-boil>
      <img data-cut="HAND" data-box="270 140">
    </div>
    <div class="abs pop shadow" style="left: 300px; top: 870px; --r: 2deg" data-at="подпишитесь:0.15" data-boil><div class="follow" style="font-size: 64px">+ Подписаться</div></div>
    <svg class="ink" width="780" height="1180"><path class="draw" pathLength="1" stroke="#6F8A4E" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"
         style="--dd: .2s" data-at="подпишитесь:0.75" d="M610 1030 L 634 1056 L 682 998"/></svg>
  </div>
</div>
