<!-- s08 — терракотовый лист въезжает снизу (акт «рынок»). «Рынок испугался.» «В день ухода акции падали | на шестнадцать
     процентов.» «А за неделю Nvidia потеряла | больше полтриллиона долларов.»
     С кадра 0 — уведомление NVDA ▼; на «испугался» — миллиметровка во всю ширину, линия цены маркером с провалом
     12 ноября; «шестнадцать» — толчок, огромное «−16%» газетными буквами у провала; «неделю» — график бледнеет, листки
     9…13 ноября (торговые дни недели); «полтриллиона» — «−$570 МЛРД» газетными буквами (−12,75 % от $4,498 трлн, outline.md). -->
<div data-backdrop class="sheetbg dark" style="--c: var(--terra)"></div>
<div class="stage">

    <div class="notif" style="left: 10px; top: 40px; width: 720px; --r: -1deg; --d: .35s">

      <div class="tx"><b>NVDA · Nvidia</b>акции падают</div>
      <div class="dn">▼</div><small>12 ноя</small>
    </div>

    <div class="grp fadeTo" style=" --to: .25" data-at="неделю:-0.2">
      <div class="abs shadow drop" style="left: 10px; top: 230px; --r: -1.5deg" data-at="испугался:-0.3">
        <div class="mm" data-torn="all" data-depth="7" style="position: relative; width: 720px; height: 560px">
          <div class="abs label" style="left: 26px; top: 20px; font-size: 28px">Nvidia · цена акции, 12 ноября</div>
          <div class="abs label" style="left: 30px; top: 500px; font-size: 26px">открытие</div>
          <div class="abs label" style="left: 560px; top: 500px; font-size: 26px">закрытие</div>
          <svg class="ink" width="720" height="560">
            <path class="draw" pathLength="1" stroke="#30353C" stroke-width="11" style="--dd: 1.5s" data-at="день:-0.2" data-sfx="marker"
                  d="M40 130 L100 170 L150 250 L195 330 L235 420 L270 455 L320 360 L370 300 L430 250 L490 230 L560 215 L640 200 L690 190"/>
            <circle cx="270" cy="455" r="18" fill="#A9503F" class="pop" data-at="шестнадцать:-0.1"/>
            <line x1="40" y1="130" x2="690" y2="130" stroke="#30353C" stroke-width="3" stroke-dasharray="10 10" opacity=".5"/>
          </svg>
        </div>
      </div>
      <div class="ransom" style="left: 310px; top: 560px" data-at="шестнадцать:0"><!--@ransom −16% 120--></div>
    </div>

    <div class="days" style="left: 20px; top: 300px; gap: 12px; transform: scale(1.3); transform-origin: 0 0">
      <div class="day pop" style="--r: -3deg" data-at="неделю:-0.1"><b>9</b><small>ноя ▼</small></div>
      <div class="day pop" style="--r: 2deg" data-at="неделю:0.05"><b>10</b><small>ноя ▼</small></div>
      <div class="day pop" style="--r: -1deg" data-at="неделю:0.2"><b>11</b><small>ноя ▼</small></div>
      <div class="day pop" style="--r: 3deg" data-at="nvidia:-0.1"><b>12</b><small>ноя ▼</small></div>
      <div class="day pop" style="--r: -2deg" data-at="nvidia:0.05"><b>13</b><small>ноя ▼</small></div>
    </div>
    <div class="ransom" style="left: 20px; top: 610px" data-at="полтриллиона:-0.15"><!--@ransom −$570 140--></div>
    <div class="ransom" style="left: 260px; top: 800px" data-at="полтриллиона:0.25"><!--@ransom МЛРД 104--></div>
    <div class="abs hand appear" style="left: 30px; top: 960px; font-size: 64px; color: var(--paper-hi)" data-at="долларов:0">за одну неделю</div>
  </div></div></div>
