<!-- s12 — приглушённый синий (лист лежит). «А у конкурентов | появился шанс.» «Google учит Gemini | на своих чипах, |
     AMD продаёт свои | OpenAI.»
     С кадра 0 — мелом «конкуренты», на «шанс» — огромное «ШАНС» газетными буквами, толчок. «google» — буквы уходят
     вверх, карточка Google, мелом линия к жетону Gemini; «чипах» — маленький чип с этикеткой «свой чип Google».
     «amd» — карточка AMD с чипом, мелом стрелка к жетону OpenAI. -->
<div data-backdrop class="sheetbg dark still" style="--c: var(--blue)"></div>
<div class="stage">
  <div class="scene"><div class="kick" style="--kx: 390px; --ky: 400px" data-at="шанс:-0.1"><div class="dive2" style="--ox: 390px; --oy: 860px">
    <!--@scraps-->
    <div class="grp away" style="--ay: -300px" data-at="google:-0.1" data-sfx="swish">
      <div class="abs chalkt write" style="left: 30px; top: 90px; font-size: 130px; --dd: .5s; --d: .05s" data-sfx="marker">у конкурентов</div>
      <div class="ransom" style="left: 60px; top: 330px" data-at="шанс:-0.1"><!--@ransom ШАНС 200--></div>
    </div>

    <div class="abs shadow slideL" style="left: 20px; top: 70px; --r: -3deg" data-at="google:0.1">
      <div class="sheet" data-torn="b" data-depth="6" style="width: 420px; height: 190px; display: flex; align-items: center; justify-content: center"><img src="logos/google.svg" alt="" style="width: 320px"></div>
    </div>
    <svg class="ink" width="780" height="1180">
      <path class="draw chalk" pathLength="1" style="--dd: .3s" data-at="gemini:-0.2" d="M440 170 C 500 170 530 190 560 220"/>
      <path class="draw chalk" pathLength="1" style="--dd: .3s" data-at="openai:-0.3" d="M380 830 C 450 830 500 840 540 860"/>
    </svg>
    <div class="token pop" style="left: 540px; top: 150px; --sz: 200px; --r: 4deg" data-at="gemini:0"><div class="c"><img src="logos/gemini.svg"></div><b>Gemini</b></div>
    <div class="abs sticker drop" style="left: 170px; top: 300px; width: 300px; height: 280px" data-at="чипах:-0.25"><img data-cut="CHIP" data-box="300 280"></div>
    <div class="abs pop shadow" style="left: 210px; top: 520px; --r: -3deg" data-at="чипах:0"><div class="tagbig sheet" style="font-size: 44px">свой чип Google</div></div>

    <div class="abs shadow slideL" style="left: 20px; top: 720px; --r: 2deg" data-at="amd:-0.2">
      <div class="sheet" data-torn="b" data-depth="6" style="width: 360px; height: 200px; display: flex; align-items: center; justify-content: center"><img src="logos/amd.svg" alt="" style="width: 280px"></div>
    </div>
    <div class="abs pop shadow" style="left: 70px; top: 940px; --r: -2deg" data-at="продаёт:0"><div class="tagbig dark" style="font-size: 44px">свои чипы → OpenAI</div></div>
    <div class="token pop" style="left: 520px; top: 760px; --sz: 210px; --r: -3deg" data-at="openai:-0.05"><div class="c"><img src="logos/openai.svg"></div><b>OpenAI</b></div>
  </div></div></div>
</div>
