<!-- s10 — тёмно-синий картон (акт «нейросети», лист лежит). «А Хуанг был лицом | этой гонки.» «Он договаривался |
     с правительствами, | с OpenAI | и с дата-центрами.»
     С кадра 0 — Хуанг в большом круге по центру; «лицом» — табличка «лицо ИИ-гонки», вокруг мелом дорожка гонки;
     «договаривался» — круг уезжает вверх и уменьшается; на каждое «с …» — мелом ветка вниз и жетон: Капитолий
