<!-- s10 — решение: «Понитейл — скилл для Клода | и правила для Кодекса и Джемини.»
     Идея: развилка. «PONYTAIL» сверху, блистер слева, от него маркером две ветки вправо: «скилл» → Claude Code,
     «правила» → Codex CLI и Gemini CLI; фишки встают на своих словах.
     b0: заголовок, блистер, верхняя ветка, «скилл»; b1: нижняя ветка, «правила», фишки. -->
<style>
  .card { width: 400px; box-sizing: border-box; padding: 16px 22px 18px; }

  .card .row { display: flex; flex-wrap: wrap; gap: 10px; }
  .card .c { padding: 8px 14px 6px; font-family: PTMono; font-size: 26px; color: var(--ink); border: 2px solid rgba(20,18,16,.4); white-space: nowrap; }
</style>
<div class="stage">

  <div class="title" style="left: -6px; top: 40px; font-size: 168px; color: var(--navy); --d: 0s">PonyTail</div>

  <!-- блистер: ч/б вырезка Kie (из s09) -->
  <div class="abs drop sticker" style="left: 0; top: 330px; width: 300px; height: 250px; --r: -8deg; --d: calc(var(--b0) + .15s)" data-boil>

    <path class="draw" pathLength="1" style="--dd: .3s" data-at="правила" d="M290 480 C 320 560, 330 620, 362 640"/>

  <div class="abs drop" style="left: 370px; top: 540px; --r: -1.5deg" data-at="правила" data-boil>

</div>
