<!-- s12 — призыв: «Было полезно — | поставьте лайк и подпишитесь.»
     Идея: карточка канала «На бумаге» (аватар — рука на терракотовом круге, brand/avatar/hand.png), под ней
     бумажное сердце на «лайк», внизу кнопка «Подписаться» — рука канала указывает на неё, галочка.
     b0: ярлык, карточка канала; «лайк»: сердце и штрихи; «подпишитесь»: рука, кнопка, галочка. -->
<style>
  .chan { width: 720px; box-sizing: border-box; padding: 26px 30px; display: flex; align-items: center; gap: 30px; }
  .chan img { width: 190px; height: 190px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 5px var(--navy); flex: none; }
  .chan b { display: block; font-family: Oswald; font-weight: 700; font-size: 88px; line-height: .95; color: var(--navy); text-transform: uppercase; white-space: nowrap; }
  .chan small { display: block; margin-top: 12px; font-family: PTMono; font-size: 32px; color: var(--dim); }
  .heart { width: 320px; height: 290px; background: var(--grain), var(--terra);
           clip-path: path('M160 286 C 60 212, 0 152, 0 86 A 80 80 0 0 1 160 56 A 80 80 0 0 1 320 86 C 320 152, 260 212, 160 286 Z'); }
  .follow { padding: 16px 34px 12px; font-family: Oswald; font-weight: 600; font-size: 58px; color: var(--paper-hi); background: var(--grain), var(--navy); white-space: nowrap; }
</style>
<div class="stage">
  <div class="kicker" style="left: 0; top: 0; --d: 0s">Было полезно?</div>
  <div class="cross" style="left: 690px; top: 4px; --d: calc(var(--b0) + .3s)"></div>
  <div class="dot" style="left: 640px; top: 420px; width: 74px; height: 74px; --d: calc(var(--b0) + .4s)"></div>

  <!-- карточка канала -->
  <div class="abs drop" style="left: 20px; top: 80px; --r: -1.5deg; --d: .05s" data-boil>
    <div class="shadow"><div class="sheet chan" data-torn="b" data-depth="7">
      <img src="../../../brand/avatar/hand.png" alt="">
      <div><b>На бумаге</b><small>@nabumage.tv</small></div>
    </div></div>
  </div>

  <!-- лайк -->
  <div class="abs pop sticker" style="left: 230px; top: 390px; --r: -4deg" data-at="лайк" data-sfx="flick" data-boil><div class="heart"></div></div>
  <svg class="ink" width="780" height="960"><g fill="none" stroke="#A9503F" stroke-width="7" stroke-linecap="round">
    <path class="draw" pathLength="1" style="--dd: .15s" data-at="лайк:0.2" d="M568 420 L 604 386"/>
    <path class="draw" pathLength="1" style="--dd: .15s" data-at="лайк:0.25" d="M584 470 L 632 462"/>
    <path class="draw" pathLength="1" style="--dd: .15s" data-at="лайк:0.3" d="M548 384 L 560 340"/>
  </g></svg>

  <!-- подписка -->
  <div class="abs slideL sticker" style="left: 0; top: 760px; width: 270px; height: 140px; --r: -3deg" data-at="подпишитесь:-0.25" data-boil>
    <img data-cut="HAND" data-box="270 140">
  </div>
  <div class="abs pop shadow" style="left: 300px; top: 770px; --r: 2deg" data-at="подпишитесь" data-boil><div class="follow">+ Подписаться</div></div>
  <svg class="ink" width="780" height="960"><path class="draw" pathLength="1" stroke="#6F8A4E" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"
       style="--dd: .2s" data-at="подпишитесь:0.6" d="M664 900 L 690 928 L 740 868"/></svg>
</div>
