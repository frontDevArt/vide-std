<!-- s02 — боль: «Знакомая боль: | полезная штука — | и только для Клода. | А у вас другой агент.»
     Идея: инструмент есть, но на нём бирка «только для Claude». Огромное «БОЛЬ» сверху, ящик с инструментами
     правее и ниже, бирка на нитке слева, внизу — «а у вас:» и фишки других агентов с вопросом.
     b0: «БОЛЬ»; b1: ящик; b2: нитка и бирка; b3: «а у вас», фишки, вопрос. -->
<style>
  .tag { position: relative; width: 250px; box-sizing: border-box; padding: 26px 22px 20px 52px; text-align: left;
         clip-path: polygon(34px 0, 100% 0, 100% 100%, 34px 100%, 0 70%, 0 30%); }
  .tag::before { content: ''; position: absolute; left: 22px; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%;
                 background: #e7dcc6; box-shadow: inset 0 2px 2px rgba(0,0,0,.25); }
  .tag small { display: block; font-family: PTMono; font-size: 20px; letter-spacing: 4px; color: var(--dim); }
  .tag b { display: block; font-family: Oswald; font-weight: 700; font-size: 50px; line-height: 1; color: var(--terra-dk); text-transform: uppercase; }
  .tag span { display: block; font-family: Oswald; font-weight: 600; font-size: 46px; line-height: 1.05; color: var(--ink); }
</style>
<div class="stage">
  <div class="cross" style="left: 690px; top: 40px; --d: calc(var(--b0) + .3s)"></div>
  <div class="dot" style="left: 600px; top: 640px; width: 64px; height: 64px; --d: calc(var(--b3) + .5s)"></div>

  <div class="title" style="left: -10px; top: 30px; font-size: 330px; color: var(--terra); --d: 0s">Боль</div>

  <!-- ящик с инструментами: ч/б вырезка Kie -->
  <div class="abs drop sticker" style="left: 300px; top: 290px; width: 470px; height: 380px; --r: 3deg; --d: var(--b1)" data-boil>
    <img data-cut="TOOLBOX" data-box="470 380">
  </div>

  <!-- нитка и бирка -->
  <svg class="ink" width="780" height="960"><path class="draw" pathLength="1" stroke="#30353C" stroke-width="2.6" fill="none"
       style="--d: var(--b2); --dd: .3s" d="M390 360 C 330 380, 290 420, 262 474"/></svg>
  <div class="abs drop" style="left: 18px; top: 420px; --r: -9deg; --d: calc(var(--b2) + .15s)" data-boil>
    <div class="shadow"><div class="sheet tag"><small>ТОЛЬКО</small><span>для</span><b>Claude</b></div></div>
  </div>

  <!-- а у вас -->
  <div class="abs hand appear" style="left: 20px; top: 728px; font-size: 62px; --d: var(--b3)">а у вас:</div>
  <div class="abs pop tanp chip shadow" style="left: 230px; top: 726px; font-size: 34px; --r: -3deg; --d: calc(var(--b3) + .2s)" data-boil>Gemini 4 Argon</div>
  <div class="abs pop tanp chip shadow" style="left: 300px; top: 812px; font-size: 34px; --r: 2deg; --d: calc(var(--b3) + .35s)" data-boil>Codex</div>
  <div class="abs hand pop" style="left: 520px; top: 760px; font-size: 150px; color: var(--terra-dk); --r: 8deg" data-at="агент:0.1">?</div>
</div>
