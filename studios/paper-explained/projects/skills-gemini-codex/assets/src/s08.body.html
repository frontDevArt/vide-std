<!-- s08 — решение: «В Кодексе скиллы встроены: | своя папка и свой установщик.»
     Идея: встроенный ящик стола. Огромное «CODEX» сверху, штамп «ВСТРОЕНО»; ящик справа, папка падает в него;
     слева полоски путей папки, внизу — кнопка встроенного установщика.
     b0: заголовок, ящик, штамп; b1: папка в ящик, пути; «установщик»: кнопка. -->
<style>
  .path { padding: 12px 20px 10px; font-family: PTMono; font-size: 30px; color: var(--navy); white-space: nowrap; }
  .inst { padding: 14px 24px 11px; font-family: PTMono; font-size: 32px; color: var(--paper-hi); background: var(--grain), var(--navy); white-space: nowrap; }
</style>
<div class="stage">
  <div class="cross" style="left: 690px; top: 900px; --d: calc(var(--b1) + .3s)"></div>
  <div class="dot" style="left: 20px; top: 300px; width: 66px; height: 66px; --d: calc(var(--b0) + .5s)"></div>

  <div class="title" style="left: -8px; top: 30px; font-size: 250px; color: var(--navy); --d: 0s">Codex</div>
  <div class="stamp" data-at="встроены" style="left: 430px; top: 250px; font-size: 52px; --r: -9deg">Встроено</div>

  <!-- ящик: ч/б вырезка Kie -->
  <div class="abs drop sticker" style="left: 290px; top: 330px; width: 480px; height: 360px; --r: 2deg; --d: calc(var(--b0) + .35s)" data-boil>
    <img data-cut="DRAWER" data-box="480 360">
  </div>
  <!-- папка падает в ящик -->
  <div class="abs drop sticker" style="left: 420px; top: 400px; width: 220px; height: 170px; --r: -4deg" data-at="папка" data-boil>
    <img data-cut="FOLDER" data-box="220 170">
  </div>

  <!-- пути -->
  <div class="abs slideL" style="left: 0; top: 700px; --r: -1.5deg" data-at="папка:0.2" data-boil>
    <div class="shadow"><div class="tanp path" data-torn="lr" data-depth="6">~/.codex/skills/</div></div>
  </div>
  <div class="abs hand appear" style="left: 344px; top: 712px; font-size: 44px" data-at="папка:0.4">или в проекте</div>
  <div class="abs slideL" style="left: 30px; top: 774px; --r: 1deg" data-at="папка:0.45" data-boil>
    <div class="shadow"><div class="tanp path" data-torn="lr" data-depth="6">.agents/skills/</div></div>
  </div>
  <div class="abs pop shadow" style="left: 300px; top: 860px; --r: -2deg" data-at="установщик" data-boil><div class="inst">$skill-installer</div></div>
</div>
