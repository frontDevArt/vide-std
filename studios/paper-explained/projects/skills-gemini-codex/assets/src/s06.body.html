<!-- s06 — решение: «И одна и та же папка | работает в Клоде, у Гугла и в Кодексе.»
     Идея: одна папка — три лотка. Папка сверху по центру, от неё пунктиром три пути вниз; копии папки падают в
     лотки Claude / Google / Codex на своих словах, у каждого — галочка.
     b0: папка, «одна и та же»; b1: лотки и пути; «Клоде», «Гугла», «Кодексе»: копия + галочка. -->
<style>
  .tray { width: 236px; height: 330px; box-sizing: border-box; padding-top: 214px; text-align: center; }
  .tray b { display: block; font-family: Oswald; font-weight: 700; font-size: 52px; line-height: 1; color: var(--navy); }
  .tray small { display: block; margin-top: 8px; font-family: PTMono; font-size: 17px; line-height: 1.3; color: var(--dim); }
  .dash { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-dasharray: 8 10; opacity: .5; }
  .reveal { animation: appear .01s linear var(--d) both; }
</style>
<div class="stage">
  <div class="cross" style="left: 30px; top: 40px; --d: calc(var(--b0) + .3s)"></div>
  <div class="dot" style="left: 650px; top: 70px; width: 76px; height: 76px; --d: calc(var(--b0) + .4s)"></div>

  <!-- папка: ч/б вырезка Kie -->
  <div class="abs drop sticker" style="left: 225px; top: 40px; width: 330px; height: 260px; --r: -2deg; --d: 0s" data-boil>
    <img data-cut="FOLDER" data-box="330 260">
  </div>
  <div class="abs pop tanp chip shadow" style="left: 470px; top: 250px; font-size: 30px; --r: 4deg" data-at="одна:0.3" data-boil>одна и та же</div>

  <!-- пути -->
  <svg class="ink" width="780" height="960"><g>
    <path class="dash reveal" style="--d: var(--b1)" d="M390 318 C 300 380, 160 420, 130 540"/>
    <path class="dash reveal" style="--d: var(--b1)" d="M390 318 L 390 540"/>
    <path class="dash reveal" style="--d: var(--b1)" d="M390 318 C 480 380, 620 420, 650 540"/>
  </g></svg>

  <!-- лотки -->
  <div class="abs slideL" style="left: 10px; top: 560px; --r: -1.5deg; --d: calc(var(--b1) - .3s)" data-boil>
    <div class="shadow"><div class="sheet tray" data-torn="t" data-depth="6"><b>Claude</b><small>Claude Code</small></div></div>
  </div>
  <div class="abs drop" style="left: 272px; top: 560px; --d: calc(var(--b1) - .2s)" data-boil>
    <div class="shadow"><div class="tanp tray" data-torn="t" data-depth="6"><b>Google</b><small>Antigravity<br>Gemini CLI</small></div></div>
  </div>
  <div class="abs slideR" style="left: 534px; top: 560px; --r: 1.5deg; --d: calc(var(--b1) - .1s)" data-boil>
    <div class="shadow"><div class="sheet tray" data-torn="t" data-depth="6"><b>Codex</b><small>Codex CLI</small></div></div>
  </div>

  <!-- копии папки падают в лотки -->
  <div class="abs drop sticker" style="left: 38px; top: 590px; width: 180px; height: 150px; --r: -6deg" data-at="клоде"><img data-cut="FOLDER" data-box="180 150"></div>
  <div class="abs drop sticker" style="left: 300px; top: 590px; width: 180px; height: 150px; --r: 3deg" data-at="гугла"><img data-cut="FOLDER" data-box="180 150"></div>
  <div class="abs drop sticker" style="left: 562px; top: 590px; width: 180px; height: 150px; --r: 6deg" data-at="кодексе"><img data-cut="FOLDER" data-box="180 150"></div>
  <svg class="ink" width="780" height="960"><g fill="none" stroke="#6F8A4E" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path class="draw" pathLength="1" style="--dd: .2s" data-at="клоде:0.25" d="M168 888 L 190 912 L 232 860"/>
    <path class="draw" pathLength="1" style="--dd: .2s" data-at="гугла:0.25" d="M430 888 L 452 912 L 494 860"/>
    <path class="draw" pathLength="1" style="--dd: .2s" data-at="кодексе:0.25" d="M692 888 L 714 912 L 756 860"/>
  </g></svg>
</div>
