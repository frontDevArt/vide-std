  - {file: assets/music/a-62d357e8.mp3, source: 'ElevenLabs Music API music_v2_5, сгенерировано 2026-11-15, song-id 6iQbSeReTYZ2sRsPNg2C', license: 'ElevenLabs Eleven Music: коммерческое использование на платном тарифе (elevenlabs.io/music-terms), тариф starter', by: генерация, prompt: 'Instrumental dreamy ambient score for a romantic short film about a lonely space probe carrying a golden record into interstellar space. Warm 1970s analog synthesizers, soft evolving pads, a slow glassy arpeggio like distant stars, gentle tape warmth, a faint heartbeat-like low pulse. 72 BPM, D major, tender and hopeful with a touch of melancholy, cinematic like a space documentary. Starts softly but immediately present, no silence at the start. Steady and calm throughout so a narrator can talk over it: no drums, no drops, no tempo changes, no lead melody in the center, no vocals, no choir. Gently swells in the last fifteen seconds and ends with a soft final chord and a natural reverb tail exactly at the end.', model: music_v2_5, seconds: 77.6, credits: 970}
