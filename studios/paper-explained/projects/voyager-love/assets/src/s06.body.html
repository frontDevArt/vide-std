<!-- s06 — кто собирал и звонок (v2). «Собирали пластинку астроном Карл Саган | и писательница Энн Друян.» «Однажды Энн
     позвонила ему по делу.» «А когда он перезвонил, | они решили пожениться.» «Хотя до этого ни разу даже не
     целовались.»
     Звёздный арт + Саган (NASA/JPL, 1980) в золотом медальоне; «астроном» — имя и «астроном» крупно; «писательница» —
     медальон Друян (NASA, 2017), «энн» — имя и «писательница»; «однажды» — фон сменяется ожившим артом телефона 70-х;
     «позвонила» — пузырь звонка от Энн; «перезвонил» — пузырь звонка от Карла; «решили» — пузыри уходят, медальоны
     сходятся рядом; «пожениться» — два золотых кольца, вспышка, толчок; «хотя» — рукой «0 поцелуев». -->
<!--@art s09 1.2 1.08 50% 40% dark-->
<!--@flip s06 @однажды:-0.2-->
<div class="grade" data-backdrop></div>
<div class="leak" data-backdrop style="--lx0: -400px; --ly0: 100px; --lx1: 300px; --ly1: 900px"></div>
<div class="flash" data-backdrop style="--d: 99s" data-at="пожениться:-0.15"></div>
<div class="stage">
  <div class="scene"><div class="kick" style="--kx: 700px; --ky: 560px" data-at="решили:0.1"><div class="dive2" style="--ox: 380px; --oy: 560px">
    <!-- до «решили»: Саган слева сверху, Друян справа снизу; на слове — медальоны встают рядом: центры (190, 560) и
         (530, 560), масштаб .78, имена — в ряд под ними -->
    <div class="abs to" style="left: 0; top: 0; width: 720px; height: 1100px; transform-origin: 210px 290px; --tx2: -20px; --ty2: 270px; --ts2: .78; --d: 99s" data-at="решили:-0.1">
      <div class="medal zin" style="left: 10px; top: 90px; width: 400px; height: 400px; --op: 50% 22%; --d: 99s" data-at="собирали:0"><img src="real/sagan-jpl.jpg" alt=""></div>
      <div class="namet whip" style="left: 30px; top: 500px; font-size: 56px; --d: 99s" data-at="астроном:-0.15">Карл Саган<small style="font-size: 30px">астроном</small></div>
    </div>
    <div class="abs to" style="left: 0; top: 0; width: 720px; height: 1100px; transform-origin: 510px 760px; --tx2: 20px; --ty2: -200px; --ts2: .78; --d: 99s" data-at="решили:-0.1">
      <div class="medal zin" style="left: 310px; top: 560px; width: 400px; height: 400px; --op: 50% 40%; --d: 99s" data-at="писательница:-0.15"><img src="real/druyan-2017.jpg" alt=""></div>
      <div class="namet whip" style="left: 300px; top: 975px; font-size: 56px; --wx: -140px; --d: 99s" data-at="энн:-0.1">Энн Друян<small style="font-size: 30px">писательница</small></div>
    </div>
    <div class="grp out" style="--oy2: -80px; --os: .8" data-at="решили:-0.2">
      <div class="bubble in rise2" style="left: 14px; top: 620px; font-size: 62px; --d: 99s" data-at="позвонила:-0.15">📞 Звонок<small style="font-size: 28px">от Энн · по делу</small></div>
      <div class="bubble rise2" style="left: 380px; top: 130px; font-size: 62px; --d: 99s" data-at="перезвонил:-0.15">📞 Звонок<small style="font-size: 28px">от Карла</small></div>
    </div>
    <svg class="abs zin" style="left: 210px; top: 840px; width: 300px; height: 196px; --d: 99s" data-at="пожениться:-0.2" viewBox="0 0 260 170">
      <circle cx="95" cy="85" r="62" fill="none" stroke="url(#gf)" stroke-width="16"/>
      <circle cx="165" cy="85" r="62" fill="none" stroke="url(#gf)" stroke-width="16"/>
      <defs><linearGradient id="gf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3C4"/><stop offset=".5" stop-color="#E9B949"/><stop offset="1" stop-color="#9C6B1E"/></linearGradient></defs>
    </svg>
    <div class="hand whip" style="left: 0; width: 720px; text-align: center; top: 1040px; font-size: 96px; --wx: -120px; --r: -3deg; --d: 99s" data-at="хотя:0">0 поцелуев</div>
  </div></div></div>
</div>
