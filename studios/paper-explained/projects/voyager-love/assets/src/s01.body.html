<!-- s01 — крючок (v2). «Запись сердца влюблённой женщины | сейчас летит в космосе | дальше всего, что сделали люди.»
     Кадр 0 — оживший арт: зонд в темноте. «запись» — настоящая Золотая пластинка (NASA) влетает в центр; «сердца» —
     через пластинку проходит золотая линия с ударом сердца; «влюблённой» — в центре пластинки бьётся сердце, толчок;
     «космосе» — пластинка с сердцем уменьшается и улетает на борт зонда (к диску арта внизу слева); «дальше» — фольгой
     «ДАЛЬШЕ ВСЕХ», «сделали» — рукой «из всего, что сделали люди». -->
