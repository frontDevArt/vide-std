# Бриф ролика. Фаза 1 заполняет этот файл. Всё, что не указано, берётся из studio/config.py (SCHEMA → DEFAULTS).
schema_version: 1        # версия схемы project.yaml; файлы без неё — старые, грузятся миграцией в памяти
title: "Почему у Claude кончаются лимиты — и две таблетки"
topic: "Почему у Claude быстро кончаются лимиты и какое лекарство — Graphify и PonyTail"
audience: "Пользователи Claude и Claude Code, которые упираются в лимиты; вынести — лимит съедает чтение контекста, Graphify и PonyTail его экономят"
kind: short-hook           # тип ролика (python -m studio kinds): explainer | short-hook | promo | music | slideshow | listicle | …
                          #   задаёт голос (music/slideshow — без голоса), пределы длительности, поля brief: и проверки QA
brief: {hook: "Вы платите за Клода. Так почему лимит кончается к обеду?"}
# brief: {}               # поля брифа по типу: short-hook {hook}, promo {product, price, cta}, listicle {count}, …
language: ru              # язык озвучки и текста: ru | en | ... (studio/lang.py). Голос auto берётся отсюда
format: vertical          # vertical 1080×1920 | horizontal 1920×1080 | square 1080×1080
platform: youtube-shorts            # площадка выхода (python -m studio platforms): youtube | youtube-shorts | tiktok | instagram-reels | …
                          #   validate сверит формат и длительность, qa — файл по профилю площадки; null — без площадки
fps: 30
target_duration: 48.0     # бета 8 сцен, ElevenLabs Artspace темп 110: речь до 47,0 с + финальный кадр ~1 с (пользователь: ~48–50 с, 2026-11-09)

tts:
  backend: elevenlabs  # с 2026-11-09 (было piper ruslan, темп 109); `new` пишет сюда --tts или первый доступный. rhvoice (офлайн, ставится tools/setup_rhvoice.sh) | edge (онлайн) | piper (офлайн нейро)
                          #   | fake (тон вместо речи — только тесты/черновики) | none (ролик без голоса: music, slideshow)
  voice: auto            # голос студии (voices: в studio.yaml → .env студии); auto — по языку (studio/lang.py). ru: aleksandr-hq | ru-RU-DmitryNeural | ru_RU-dmitri-medium;
                          #   en: slt | en-US-GuyNeural | en_US-lessac-medium
  rate: 110               # ElevenLabs — только числом (auto синтезировал бы несколько раз — деньги)
  rate_range: [98, 125]   # что считаем естественным темпом

pauses:                   # секунды
  start: 0.3              # тишина в начале ролика (ElevenLabs держит паузы в речи сам — короче, чем у piper)
  comma: 0.14             # после строки, оканчивающейся на , : ; —
  sentence: 0.26          # после строки, оканчивающейся на . ! ?
  scene: 0.3              # между сценами
  end: 0.5                # в конце ролика

style:
  palette: neon           # neon | calm | lab  (studio/gfx.py: PALETTES)
  # mood: lab             # только lab: lab | night | ember | deep | orchid (channel/STYLE.md §14)
  # overrides: {accent2: "#F78FB3"}   # HEX поверх настроения: glow_cool, glow_warm, accent2
  font: Inter Display

music:
  enabled: false          # с 2026-11-09 вместо музыки — бумажные звуки под движение (sfx ниже, просьба пользователя)
  level_db: -13           # уровень подложки; QA требует, чтобы музыка была на 14–28 LU тише голоса
  duck: true              # приглушать музыку под голосом
  # sync: beat               # склейки сцен в долю трека (bar — в сильную долю); kind: music — включено (ROADMAP C3)
  # file: drive.mp3           # свой трек: путь от папки проекта или имя в brand/music/ студии (будет зациклен)
  # by_chapter: {ch02: calm.mp3}   # свой трек на главу, стык — кроссфейд (crossfade: 2.0)

# Звуки под движение: страницы сцен отдают старты анимаций (common.js → window.sfx), звуки — studio/sfx.py.
# Без музыки их слышно хуже на тишине — уровень поднят относительно умолчания (−28…−32 dB к голосу).
sfx: {enabled: true, level_db: 10}

subtitles:
  enabled: true
  max_lines: 2

loudness: -16             # LUFS итога (YouTube/соцсети: -14…-16)

chapters: [ch01]

# Картинки Kie (docs/IMAGES.md): предметы-вырезки и фоны коллажа; текст и пометки — кодом (web.html).
images:
  enabled: true
  style: "Style: black and white editorial halftone cut-out, vintage magazine print, high contrast, visible halftone dots and ink imperfections, cleanly isolated subject with a thin white paper cut border, premium paper collage quality, flat even light. Isolated on a plain flat light grey background. No clutter, no text, no letters, no numbers, no logos, no watermark, no anime, no cartoon style, no CGI look, no glossy 3D rendering, no photorealistic background, no oversaturated colors, no distorted anatomy, no blurry details"   # brand/PROMPTS.md
  budget_usd: 1
