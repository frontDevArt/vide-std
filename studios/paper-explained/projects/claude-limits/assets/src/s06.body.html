<!-- s06 — Graphify: «Таблетка первая — Графифай. | Он один раз рисует карту проекта: | что с чем связано. |
     И Клод спрашивает карту, | а не читает всё подряд.»
     Идея: карта вместо чтения. «GRAPHIFY» поперёк круга, перед ним — компас (ч/б вырезка); вокруг — файлы-фишки.
     b0: ярлык «таблетка № 1», круг, заголовок, компас; b1: фишки файлов; b2: линии связей;
     b3: вопрос Клода и маршрут терракотой; b4: лишние фишки гаснут. -->
<style>
  .node { position: absolute; width: 190px; height: 66px; display: flex; align-items: center; justify-content: center;
          font-family: PTMono; font-size: 28px; }
  .node .bg { position: absolute; inset: 0; }
  .node span { position: relative; }
  .hot { position: absolute; inset: 0; background: var(--grain), var(--terra); animation: appear .01s linear var(--d) both; }
  .ht { animation: hotTxt .01s linear var(--d) both; }
  @keyframes hotTxt { from { color: var(--ink); } to { color: var(--paper-hi); } }
  .q { padding: 12px 20px 10px; font-family: PTMono; font-size: 25px; color: var(--paper-hi); background: var(--navy); }
  .dim-later { animation: drop .5s cubic-bezier(.2,.8,.3,1.15) var(--d) both, fadeTo .4s linear var(--b4) forwards; --to: .3; }
</style>
<div class="stage">
  <div class="kicker" style="left: 0; top: 20px; --d: var(--b0)">Таблетка № 1</div>
  <div class="cross" style="left: 690px; top: 300px; --d: calc(var(--b0) + .3s)"></div>
  <div class="dot" style="left: 40px; top: 360px; width: 70px; height: 70px; --d: calc(var(--b0) + .4s)"></div>
  <div class="disc" style="left: 110px; top: 240px; width: 560px; height: 560px; --d: calc(var(--b0) + .1s)"></div>
  <svg class="ink rings" width="780" height="960">
    <circle class="draw" pathLength="1" cx="390" cy="520" r="315" style="--d: calc(var(--b0) + .3s); --dur: .7s"/>
    <circle class="draw" pathLength="1" cx="390" cy="520" r="350" style="--d: calc(var(--b0) + .45s); --dur: .7s"/>
  </svg>

  <!-- связи: от компаса к файлам и между файлами -->
  <svg class="ink" width="780" height="960"><g stroke="#141210" stroke-width="2.4" opacity=".75">
    <path class="draw" pathLength="1" style="--d: calc(var(--b2) + .00s); --dur: .3s" d="M390 520 L 115 200"/>
    <path class="draw" pathLength="1" style="--d: calc(var(--b2) + .10s); --dur: .3s" d="M390 520 L 665 200"/>
    <path class="draw" pathLength="1" style="--d: calc(var(--b2) + .20s); --dur: .3s" d="M390 520 L 95 640"/>
    <path class="draw" pathLength="1" style="--d: calc(var(--b2) + .30s); --dur: .3s" d="M390 520 L 685 640"/>
    <path class="draw" pathLength="1" style="--d: calc(var(--b2) + .40s); --dur: .3s" d="M390 520 L 165 880"/>
    <path class="draw" pathLength="1" style="--d: calc(var(--b2) + .50s); --dur: .3s" d="M390 520 L 615 880"/>
    <path class="draw" pathLength="1" style="--d: calc(var(--b2) + .60s); --dur: .3s" d="M115 200 Q 60 420 95 640"/>
    <path class="draw" pathLength="1" style="--d: calc(var(--b2) + .70s); --dur: .3s" d="M685 640 Q 700 780 615 880"/>
  </g>
  <!-- маршрут ответа -->
  <g stroke="#C46557" stroke-width="12" fill="none">
    <path class="draw" pathLength="1" style="--d: calc(var(--b3) + .35s); --dur: .3s" d="M390 520 L 115 200"/>
    <path class="draw" pathLength="1" style="--d: calc(var(--b3) + .55s); --dur: .3s" d="M390 520 L 685 640"/>
  </g></svg>

  <!-- заголовок за компасом -->
  <div class="title" style="left: 0; right: 0; text-align: center; top: 446px; font-size: 182px; --d: calc(var(--b0) + .15s)">Graphify</div>

  <!-- компас: ч/б вырезка Kie (assets/images/283aca453243fb7e.cut.png, brand/PROMPTS.md) -->
  <div class="abs drop sticker" style="left: 297px; top: 412px; width: 186px; height: 215px; --r: -8deg; --d: calc(var(--b0) + .35s)" data-boil>
    <img src="images/283aca453243fb7e.cut.png" alt="" style="position: absolute; left: -49.4px; top: -33.0px; width: 278.5px; height: 278.5px">
  </div>

  <!-- файлы-фишки (центры: концы линий) -->
  <div class="node drop" style="left: 20px; top: 167px; --r: -3deg; --d: calc(var(--b1) + .00s)" data-boil><div class="bg shadow"><div class="sheet" style="width:100%;height:100%"></div></div><div class="hot" style="--d: calc(var(--b3) + .5s)"></div><span class="ht" style="--d: calc(var(--b3) + .5s)">auth.py</span></div>
  <div class="node drop dim-later" style="left: 570px; top: 167px; --r: 2deg; --d: calc(var(--b1) + .15s)" data-boil><div class="bg shadow"><div class="sheet" style="width:100%;height:100%"></div></div><span>ui.tsx</span></div>
  <div class="node drop dim-later" style="left: 0; top: 607px; --r: 3deg; --d: calc(var(--b1) + .30s)" data-boil><div class="bg shadow"><div class="sheet" style="width:100%;height:100%"></div></div><span>utils.py</span></div>
  <div class="node drop" style="left: 590px; top: 607px; --r: -2deg; --d: calc(var(--b1) + .45s)" data-boil><div class="bg shadow"><div class="sheet" style="width:100%;height:100%"></div></div><div class="hot" style="--d: calc(var(--b3) + .7s)"></div><span class="ht" style="--d: calc(var(--b3) + .7s)">api.py</span></div>
  <div class="node drop dim-later" style="left: 70px; top: 847px; --r: 2deg; --d: calc(var(--b1) + .60s)" data-boil><div class="bg shadow"><div class="sheet" style="width:100%;height:100%"></div></div><span>db.py</span></div>
  <div class="node drop dim-later" style="left: 520px; top: 847px; --r: -3deg; --d: calc(var(--b1) + .75s)" data-boil><div class="bg shadow"><div class="sheet" style="width:100%;height:100%"></div></div><span>tests.py</span></div>

  <!-- вопрос Клода -->
  <div class="abs drop shadow" style="left: 330px; top: 12px; --r: 1.5deg; --d: var(--b3)" data-boil><div class="q">Claude: где проверка входа?</div></div>
</div>
