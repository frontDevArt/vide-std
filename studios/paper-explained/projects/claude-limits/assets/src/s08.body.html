<!-- s08 — вывод: «Меньше читать. | Меньше писать. | Дольше лимит.»
     Идея: рецепт. Три рваные полоски по битам, у каждой — предмет из ролика: компас (Graphify), флакон (PonyTail)
     и песочные часы из s01 — перевёрнутые: песок снова наверху. Последним — штамп. Новых картинок нет.
     b0: ярлык, компас и «меньше читать»; b1: флакон и «меньше писать»; b2: часы и «дольше лимит» терракотой, штамп. -->
<style>
  .rx { padding: 18px 26px 12px; }
  .rx b { display: block; font-family: Oswald; font-weight: 700; font-size: 72px; line-height: .95; text-transform: uppercase; white-space: nowrap; letter-spacing: -1px; }
  .rx .label { margin-top: 6px; }
  .rx.hotp { background: var(--grain), var(--terra); }
  .rx.hotp b { color: var(--paper-hi); font-size: 72px; }
  .flip { position: absolute; inset: 0; transform: rotate(180deg); }
</style>
<div class="stage">
  <div class="kicker" style="left: 0; top: 20px; --d: var(--b0)">Рецепт</div>
  <div class="dot" style="left: 690px; top: 96px; width: 66px; height: 66px; --d: calc(var(--b0) + .3s)"></div>
  <div class="cross" style="left: 700px; top: 600px; --d: calc(var(--b1) + .3s)"></div>
  <svg class="ink rings" width="780" height="960">
    <path class="draw thin" pathLength="1" d="M190 330 L 760 330" style="--d: calc(var(--b0) + .4s)"/>
    <path class="draw thin" pathLength="1" d="M190 610 L 760 610" style="--d: calc(var(--b1) + .4s)"/>
  </svg>

  <!-- меньше читать -->
  <div class="abs drop sticker" style="left: 8px; top: 110px; width: 170px; height: 196px; --r: -6deg; --d: calc(var(--b0) + .1s)" data-boil>
    <img data-cut="283aca453243fb7e" data-box="170 196">
  </div>
  <div class="abs slideR" style="left: 196px; top: 140px; --r: -1.5deg; --d: calc(var(--b0) + .2s)" data-boil>
    <div class="shadow"><div class="sheet rx" data-torn="lr" data-depth="9"><b>Меньше читать</b><div class="label">Graphify — карта вместо файлов</div></div></div>
  </div>

  <!-- меньше писать -->
  <div class="abs drop sticker" style="left: 44px; top: 360px; width: 116px; height: 236px; --r: 5deg; --d: var(--b1)" data-boil>
    <img data-cut="ee47e06d231dc805" data-box="116 236">
  </div>
  <div class="abs slideR" style="left: 196px; top: 420px; --r: 1deg; --d: calc(var(--b1) + .1s)" data-boil>
    <div class="shadow"><div class="sheet rx" data-torn="lr" data-depth="9"><b>Меньше писать</b><div class="label">PonyTail — только нужный код</div></div></div>
  </div>

  <!-- дольше лимит: часы перевёрнуты (тень — снаружи поворота, падает вниз) -->
  <div class="abs drop sticker" style="left: 16px; top: 640px; width: 180px; height: 277px; --r: 3deg; --d: var(--b2)" data-boil>
    <div class="flip"><img data-cut="24d3ada43b9b3492" data-box="180 277"></div>
  </div>
  <div class="abs slideR" style="left: 200px; top: 712px; --r: -1deg; --d: calc(var(--b2) + .1s)" data-boil>
    <div class="shadow"><div class="rx hotp" data-torn="lr" data-depth="9"><b>Дольше лимит</b></div></div>
  </div>
  <div class="stamp" data-at="лимит:0.35" style="left: 470px; top: 860px; font-size: 44px; --r: -7deg">Выписано</div>
</div>
