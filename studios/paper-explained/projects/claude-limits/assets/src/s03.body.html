<!-- s03 — нарастание: «Первое сообщение стоит копейки. | Тридцатое тащит за собой | все двадцать девять.»
     Идея: гиря на цепи. Лестница из тридцати бумажных столбиков (условная схема, без цифр), заголовок «КОПЕЙКИ».
     b0: заголовок, первый столбик и ярлык «первое»; b1: столбики растут, тридцатый — терракотой, ярлык;
     со слова «тащит» — гиря с цепью падает и цепь тянется к тридцатому; b2: скобка под прошлыми и подпись. -->
<style>
  .bar { position: absolute; width: 17px; background: var(--grain), var(--tan); transform-origin: 50% 100%;
         box-shadow: 0 6px 6px rgba(60,45,20,.16); animation: grow .35s cubic-bezier(.2,.8,.3,1.1) var(--d) both; }
  .bar.hot { background: var(--grain), var(--terra); }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  .chip { padding: 8px 16px 6px; font-family: PTMono; font-size: 24px; color: var(--navy); }
  .note { font-family: PTSerif; font-style: italic; font-size: 22px; color: var(--dim); }
</style>
<div class="stage">
  <div class="title" style="left: 0; top: 40px; font-size: 150px; --d: var(--b0)">Копейки</div>
  <div class="abs note appear" style="left: 4px; top: 200px; --d: calc(var(--b0) + .3s)">условная схема, не замер</div>
  <div class="cross" style="left: 660px; top: 40px; --d: calc(var(--b0) + .2s)"></div>
  <div class="dot" style="left: 610px; top: 760px; width: 70px; height: 70px; --d: calc(var(--b1) + .2s)"></div>

  <svg class="ink" width="780" height="960"><path class="draw thin" pathLength="1" d="M20 702 L 760 702" style="--d: calc(var(--b0) + .1s); --dur: .5s"/></svg>
  <div id="bars"></div>
  <script>
    // 30 столбиков: шаг 24 px, высота растёт линейно; первый — на b0, остальные шагом с b1, тридцатый — терракотой
    (function () {
      const box = document.getElementById('bars');
      for (let i = 0; i < 30; i++) {
        const h = 16 + i * 470 / 29, el = document.createElement('div');
        el.className = 'bar' + (i === 29 ? ' hot' : '');
        el.style.cssText = `left: ${30 + i * 24}px; top: ${700 - h}px; height: ${h}px; --d: ` +
          (i === 0 ? 'calc(var(--b0) + .35s)' : `calc(var(--b1) + ${(i * 0.035).toFixed(3)}s)`);
        box.appendChild(el);
      }
    })();
  </script>

  <!-- ярлыки -->
  <svg class="ink" width="780" height="960"><g stroke="#30353C" stroke-width="2.4" fill="none">
    <path class="draw" pathLength="1" style="--d: calc(var(--b0) + .5s); --dur: .3s" d="M40 676 L 70 610 L 120 610"/>
    <path class="draw" pathLength="1" style="--d: calc(var(--b1) + 1.1s); --dur: .3s" d="M741 210 L 741 196"/>
  </g></svg>
  <div class="abs pop sheet chip shadow" style="left: 120px; top: 586px; --r: -2deg; --d: calc(var(--b0) + .6s)" data-boil>первое</div>
  <div class="abs pop sheet chip shadow" style="left: 590px; top: 150px; --r: 2deg; --d: calc(var(--b1) + 1.15s)" data-boil>тридцатое</div>

  <!-- гиря с цепью и связь с тридцатым -->
  <svg class="ink" width="780" height="960"><path class="draw" data-at="тащит:0.35" pathLength="1" stroke="#30353C" stroke-width="7"
       fill="none" stroke-linecap="round" style="--dur: .45s" d="M302 868 Q 560 840 741 706"/></svg>
  <div class="abs drop sticker" style="left: 18px; top: 726px; width: 320px; height: 218px; --r: 3deg" data-at="тащит" data-boil>
    <img data-cut="fbf234bbcc6c8d0f" data-box="320 218">
  </div>

  <!-- все прошлые -->
  <svg class="ink" width="780" height="960"><path class="draw" pathLength="1" stroke="#C46557" stroke-width="4" fill="none"
       style="--d: var(--b2); --dur: .4s" d="M30 716 L 30 730 L 726 730 L 726 716"/></svg>
  <div class="abs slideR" style="left: 400px; top: 880px; --r: -1deg; --d: calc(var(--b2) + .25s)" data-boil>
    <div class="shadow"><div class="sheet chip" data-torn="lr" data-depth="6">всё, что было до</div></div>
  </div>
</div>
