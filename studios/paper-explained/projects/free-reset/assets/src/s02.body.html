<!-- s02 — почему, СЧЁТЧИК И ЖУК: «Антропик это признала.» «Из-за ошибок | лимит тратился быстрее, чем должен.»
     Начало — отъезд камеры из барабанов счётчика (продолжение нырка s01 в полосу недели). Бумажный счётчик «лимит
     недели»: пять барабанов цифр крутятся, диск под ними вертится. «Антропик» — плашка «ANTHROPIC ПРИЗНАЛА».
     «ошибок» — из-за счётчика выползает жук-«баг», маркер обводит его, рукой «баг = ошибка».
     «быстрее» — барабаны и диск разгоняются, счётчик трясёт; «должен» — штамп «ПЕРЕРАСХОД». -->
