<!-- s04 — путь, ЭКСКУРСИЯ ПО НАСТОЯЩЕМУ ЭКРАНУ: «Настройки, | вкладка Юсэдж, | и вот эта кнопка.» «Или короткая
     ссылка на экране.»
     Первый кадр — как последний в s03 (распечатка внизу, «Full reset» под маркером). Камера: «Настройки» — к заголовку
     Settings (кольцо); «Юсэдж» — к вкладке Usage (кольцо); «вот» — к строке Full reset и кнопке Reset for free
     (кольцо), «кнопка» — рука бренда нажимает, круги клика. «ссылка» — камера отъезжает, сверху падает ярлык
     «clau.de/reset». Конец — наезд на ярлык (s05 начинается заново). Кнопку на самом деле никто не нажимал. -->
<div class="stage">
  <div class="cam-l" style="--ox: 390px; --oy: 800px; --s1: 3; --o1: 0; --dd: .42s; --d: calc(var(--dur) - .42s)">
    <div class="cam" data-bottom="966">
      <div class="tour" data-view="390 480"
           data-tour='[[0, 398, 204.45, 0.62], ["настройки:0.05", 190, 200, 2.0, 0.55], ["юсэдж:-0.2", 140, 196, 3.0, 0.45], ["вот:-0.2", 668, 505, 2.6, 0.55], ["ссылка:-0.4", 398, 300, 0.66, 0.6]]'>
        <!--@shot-->
        <div class="hl" style="left: 238px; top: 457px; width: 222px; height: 51px; animation: none"></div>
        <!--@ring {"box": [20, 18, 104, 56], "at": "настройки:0.25", "c": "#E0C377", "w": 4}-->
        <!--@ring {"box": [24, 174, 220, 222], "at": "юсэдж:0.1", "c": "#E0C377", "w": 4}-->
        <!--@ring {"box": [634, 460, 768, 508], "at": "вот:0.3", "c": "#E0C377", "w": 4}-->
        <div class="click" style="left: 749px; top: 496px" data-at="кнопка:0.1"><i></i><i></i></div>
        <div class="abs press sticker" style="left: 749px; top: 484px; width: 150px; height: 68px; --r: 35deg; transform-origin: 0 12px"
             data-at="кнопка:-0.35" data-sfx="flick">
          <div style="position: absolute; inset: 0; transform: scaleX(-1)"><img data-cut="HAND" data-box="150 68"></div>
        </div>
      </div>
    </div>

    <!-- ярлык со ссылкой -->
    <div class="abs drop shadow" style="left: 30px; top: 704px; --r: -2deg" data-at="ссылка:-0.15">
      <div class="tanp" style="width: 720px; box-sizing: border-box; padding: 16px 34px 24px" data-torn="tb" data-depth="7">
        <div class="hand" style="font-size: 50px; color: var(--terra-dk)">или короткая ссылка</div>
        <div style="font-family: PTMono; font-size: 78px; line-height: 1.1; color: var(--navy); white-space: nowrap">clau.de/reset</div>
      </div>
    </div>
  </div>
</div>
