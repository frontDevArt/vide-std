# Бриф ролика. Всё, что не указано, берётся из studio/config.py (SCHEMA → DEFAULTS) и defaults студии.
schema_version: 1
title: "Лимит Claude кончился раньше? Вам не показалось"
topic: "Anthropic признала, что из-за ошибок лимит Claude тратился быстрее, и положила в каждый платный аккаунт бесплатный полный сброс по 10 декабря: где кнопка на настоящем экране и когда жать, чтобы сброс не пропал зря"
audience: "Русскоязычные подписчики Claude (Pro, Max, Ultra, Team) — аудитория хита claude-limits. Вынести: сброс уже лежит в аккаунте (Settings → Usage → Reset for free или clau.de/reset); жать, когда неделя кончилась, а до обновления ещё дни; срок — по 10 декабря включительно"
kind: explainer           # длительность по речи; потолок 50 с (пользователь), план ~44 с
language: ru
format: vertical
platform: tiktok
fps: 30
target_duration: null

tts:
  backend: elevenlabs     # голос студии Artspace (voices: в studio.yaml → .env студии); «да» пользователя 2026-11-12
  voice: auto             # (черновик кадров и движения был на piper ruslan, бесплатно)
  rate: 110               # ElevenLabs — только числом
  rate_range: [98, 125]
  context: false          # без соседних строк: иначе обрывы на стыках (docs/LESSONS.md)

pauses:                   # как в правилах студии: 0,42 / 0,6 с; старт короче — крючок с первого кадра
  start: 0.2
  comma: 0.18
  sentence: 0.42
  scene: 0.6
  end: 0.6

style:
  palette: neon           # перекрыто бренд-китом студии (defaults.style.brand)
  font: Inter Display

music:
  enabled: false          # студия: без музыки — бумажные звуки под движение
  level_db: -13
  duck: true

sfx: {enabled: true, level_db: 10}

subtitles:
  enabled: true           # в .srt/.vtt; в кадре подписи рисует страница (paper_page)
  max_lines: 2

loudness: -14             # профиль tiktok

chapters: [ch01]

# Картинок Kie нет: настоящий экран Claude (assets/screen/, снят с аккаунта пользователя) и всё остальное — кодом.
images:
  enabled: false

# Пакет к загрузке — только если пользователь попросит (memory: video-only).
package:
  title: "Лимит Claude кончился раньше? Вам не показалось"
  description: >-
    Anthropic признала: из-за ошибок лимит Claude тратился быстрее, чем должен. В извинение всем на Pro, Max, Ultra и
    Team — один бесплатный полный сброс. Где: Settings → Usage → Limit resets → Reset for free (или clau.de/reset).
    Жмите, когда неделя кончилась, а до обновления ещё дни — день обновления сброс не сдвигает. Срок — по 10 декабря
    включительно (до 01:00 по Москве 11 декабря). А на Pro рядом может лежать ещё сброс Fable — по 16 ноября
    включительно.
  hashtags: [claude, нейросети, лимиты, ии, anthropic]   # tiktok: не больше 5
  cover: {at: 3.75}         # s01: настоящий экран, маркер на «run out Saturday night» и штамп «НЕ ПОКАЗАЛОСЬ»
  ai_label: false           # решение студии (CLAUDE.md, 2026-11-10): коллаж и синтезированная озвучка под отметку не попадают

avoid:
  - {numbers_without_source: false}   # решение пользователя 2026-11-10: источников в кадре нет — факты сверены до ролика
  - "хайп и крик; логотип Anthropic/Claude как свой — только настоящий экран интерфейса как он есть"
  - "не утверждать: что ошибки задели всех, что лимит станет больше, какие именно были ошибки"
  - "имя, почта и другие личные данные пользователя в кадре (снимок экрана — только окно Settings)"
  - "раскладки прошлых роликов: круг + заголовок поперёк + предмет (claude-limits), забег-полосы (fable-52), три лотка (skills-gemini-codex), башня (bot-layers), стакан и лист снизу (shared-limit), стол мамы и конверт с листом втрое (voice-clone)"
done_means:
  - "длительность не больше 50 с; первая фраза-крючок звучит к 2,5 с, кадр в движении с первого кадра"
  - "формула канала: боль (лимит раньше) → почему (ошибки) → лекарство (сброс уже в аккаунте) → путь на настоящем экране → когда жать → срок; вылечено на том же случае (суббота)"
  - "настоящий экран Claude с зумом на вкладку Usage и кнопку Reset for free; срок крупно с московским временем"
  - "вопрос в комментарии; лайк и подписка в финале"
