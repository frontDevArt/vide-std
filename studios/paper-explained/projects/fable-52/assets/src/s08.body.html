<!-- s08 — подарок: «Теперь подарок. | По шестнадцатое ноября включительно | Фейбл входит в подписку Про. |
     На него уходит | до половины недельного лимита.»
     Идея: недельный лимит — пирог; половину можно отдать Fable. Сверху — лента дней 9…16 под маркером, пирог
     (вид сверху) делится пополам кодом: левая половина остаётся, правая отъезжает; справа внизу — «50 %».
     b0: ярлык, пирог; b1: лента дней, 16 — терракотой, крупно «по 16 ноября включительно» и «до 10:59 по Москве 17 ноября»; b2: фишка «в подписке Pro»; b3: пирог делится; b4: «50 %». -->
<style>
  .d { position: absolute; top: 102px; width: 74px; height: 74px; font-family: PTMono; font-size: 30px; color: var(--navy);
       display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 6px rgba(60,45,20,.16); }
  .d.last { background: var(--grain), var(--terra); color: var(--paper-hi); }
  .half { position: absolute; top: 0; width: 165px; height: 330px; overflow: hidden; }
  .half > div { position: absolute; top: 0; width: 330px; height: 330px; }
  .till { position: absolute; left: 0; font-family: Oswald; font-weight: 700; font-size: 54px; line-height: 1; text-transform: uppercase; letter-spacing: -1px; white-space: nowrap; color: var(--ink); }
  .till u { text-decoration: none; color: var(--terra-dk); }
  .msk { padding: 8px 16px 6px; font-family: PTMono; font-size: 27px; color: var(--paper-hi); background: var(--grain), var(--navy); white-space: nowrap; }
  .splitR { animation: splitR .5s cubic-bezier(.2,.8,.3,1.1) var(--d) both; }
  @keyframes splitR { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(128px, 26px) rotate(9deg); } }
</style>
<div class="stage">
  <div class="kicker" style="left: 0; top: 20px; --d: var(--b0)">Подарок</div>
  <div class="abs label appear" style="left: 548px; top: 34px; --d: var(--b1)">ноябрь 2026</div>
  <div class="cross" style="left: 20px; top: 800px; --d: calc(var(--b0) + .3s)"></div>
  <div class="dot" style="left: 200px; top: 820px; width: 60px; height: 60px; --d: calc(var(--b3) + .3s)"></div>

  <!-- дни 9…16 -->
  <div id="days"></div>
  <script>
    (function () {
      const box = document.getElementById('days');
      for (let i = 0; i < 8; i++) {
        const el = document.createElement('div');
        el.className = 'd appear ' + (i === 7 ? 'last' : 'sheet');
        el.style.cssText = `left: ${12 + i * 96}px; --d: calc(var(--b1) + ${(i * 0.06).toFixed(2)}s)`;
        el.textContent = 9 + i;
        box.appendChild(el);
      }
    })();
  </script>
  <svg class="ink" width="780" height="960"><path class="draw" pathLength="1" stroke="#C46557" stroke-width="9" fill="none"
       style="--d: calc(var(--b1) + .5s); --dd: .5s" d="M14 194 C 200 204, 520 188, 760 198"/></svg>
  <div class="till rise" style="top: 214px; animation: rise .5s cubic-bezier(.2,.8,.3,1.1) both" data-at="шестнадцатое">по <u>16 ноября</u> включительно</div>
  <div class="abs slideL shadow" style="left: 0; top: 278px; --r: -.8deg" data-at="включительно:0.2" data-boil><div class="msk">= до 10:59 по Москве 17 ноября</div></div>

  <!-- входит в подписку -->
  <div class="abs slideL" style="left: 0; top: 342px; --r: -1.5deg; --d: var(--b2)" data-boil>
    <div class="shadow"><div class="tanp chip" data-torn="lr" data-depth="6" style="font-size: 27px">Fable 5.2 → в подписке Pro</div></div>
  </div>
  <div class="abs label appear" style="left: 470px; top: 358px; font-size: 21px; --d: calc(var(--b2) + .3s)">и Team (standard)</div>

  <!-- пирог: две половины одной вырезки Kie -->
  <div class="abs drop" style="left: 24px; top: 410px; width: 330px; height: 330px; --r: -3deg; --d: calc(var(--b0) + .2s)" data-boil>
    <div class="sticker" style="position: absolute; inset: 0">
      <div class="half" style="left: 0"><div style="left: 0"><img data-cut="PIE" data-box="330 330"></div></div>
    </div>
    <div class="sticker splitR" style="position: absolute; inset: 0; --d: var(--b3)" data-sfx="slide">
      <div class="half" style="left: 165px"><div style="left: -165px"><img data-cut="PIE" data-box="330 330"></div></div>
    </div>
  </div>
  <div class="abs pop sheet chip shadow" style="left: 30px; top: 746px; --r: -3deg; --d: calc(var(--b3) + .3s)" data-boil>на Fable</div>
  <div class="abs pop sheet chip shadow" style="left: 386px; top: 420px; --r: 4deg; --d: calc(var(--b3) + .45s)" data-boil>остальным моделям</div>

  <!-- половина -->
  <div class="abs pop num" style="left: 404px; top: 700px; font-size: 176px; --r: -2deg; --d: var(--b4)" data-boil>50%</div>
  <div class="abs label appear" style="left: 408px; top: 866px; white-space: nowrap; --d: calc(var(--b4) + .3s)">недельного лимита</div>

  <div class="src appear" style="top: 908px; --d: calc(var(--b1) + .3s)">Источник: support.claude.com, «Fable 5.2 launch offers»; 16.11, 23:59 PT.</div>
</div>
