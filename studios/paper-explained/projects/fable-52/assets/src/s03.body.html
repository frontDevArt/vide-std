<!-- s03 — что нового: «Что нового? | Отвечает до тридцати процентов быстрее. | Стоит дешевле. |
     И вдвое реже отказывает по ошибке.»
     Идея: три бирки на нитках, лесенкой сверху вниз; секундомер — справа вверху, за ним бледное «5.2».
     b0: ярлык, «5.2», секундомер; b1–b3: бирки по одной. -->
<style>
  .tag { position: relative; width: 470px; height: 150px; box-sizing: border-box; padding: 18px 20px 0 74px; }
  .tag::before { content: ''; position: absolute; left: 24px; top: 58px; width: 26px; height: 26px; border-radius: 50%; background: var(--paper);
                 box-shadow: inset 0 2px 3px rgba(60,45,20,.4); }
  .tag .num { font-size: 88px; }
  .tag .label { margin-top: 8px; font-size: 21px; white-space: nowrap; }
  .ghost { position: absolute; font-family: Oswald; font-weight: 700; font-size: 330px; line-height: .8; color: var(--tan); letter-spacing: -6px;
           mix-blend-mode: multiply; animation: rise .5s cubic-bezier(.2,.8,.3,1.1) var(--d) both; }
</style>
<div class="stage">
  <div class="kicker" style="left: 0; top: 20px; --d: var(--b0)">Что нового</div>
  <div class="ghost" style="left: 0; top: 96px; --d: calc(var(--b0) + .1s)">5.2</div>
  <div class="cross" style="left: 20px; top: 820px; --d: calc(var(--b2) + .3s)"></div>
  <div class="dot" style="left: 96px; top: 640px; width: 74px; height: 74px; --d: calc(var(--b2) + .2s)"></div>

  <!-- секундомер: ч/б вырезка Kie -->
  <div class="abs drop sticker" style="left: 478px; top: 30px; width: 280px; height: 330px; --r: 7deg; --d: calc(var(--b0) + .25s)" data-boil>
    <img data-cut="WATCH" data-box="280 330">
  </div>

  <!-- нитки: от гвоздика к отверстию бирки -->
  <svg class="ink" width="780" height="960"><g fill="none" stroke="#30353C" stroke-width="2.4">
    <path class="draw" pathLength="1" style="--d: var(--b1); --dd: .25s" d="M30 352 C 34 390, 46 420, 55 450"/>
    <path class="draw" pathLength="1" style="--d: var(--b2); --dd: .25s" d="M160 532 C 166 570, 176 600, 185 628"/>
    <path class="draw" pathLength="1" style="--d: var(--b3); --dd: .25s" d="M290 712 C 296 750, 306 780, 315 806"/>
  </g><g fill="#30353C">
    <circle class="appear" cx="30" cy="352" r="7" style="--d: var(--b1)"/><circle class="appear" cx="160" cy="532" r="7" style="--d: var(--b2)"/>
    <circle class="appear" cx="290" cy="712" r="7" style="--d: var(--b3)"/>
  </g></svg>

  <div class="abs drop" style="left: 18px; top: 380px; --r: -2deg; --d: calc(var(--b1) + .1s)" data-boil>
    <div class="shadow"><div class="sheet tag" data-torn="r" data-depth="7"><div class="num">до 30 %</div><div class="label">быстрее, чем Fable 5.1</div></div></div>
  </div>
  <div class="abs drop" style="left: 148px; top: 558px; --r: 1.5deg; --d: calc(var(--b2) + .1s)" data-boil>
    <div class="shadow"><div class="sheet tag" data-torn="r" data-depth="7"><div class="num" style="color: var(--navy)">$8 / $40</div><div class="label">за млн токенов — дешевле</div></div></div>
  </div>
  <div class="abs drop" style="left: 278px; top: 736px; --r: -1.5deg; --d: calc(var(--b3) + .1s)" data-boil>
    <div class="shadow"><div class="sheet tag" data-torn="r" data-depth="7"><div class="num">−55 %</div><div class="label">лишних блокировок</div></div></div>
  </div>

  <div class="src appear" style="top: 908px; --d: calc(var(--b1) + .3s)">Источник: Anthropic, 9 нояб. 2026; к Fable 5.1, блокировки — ранние тесты.</div>
</div>
