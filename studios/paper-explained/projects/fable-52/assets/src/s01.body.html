<!-- s01 — крючок: «Вышел Фейбл пять-два — | новая старшая модель Клода. | И к запуску — подарок: |
     неделю он входит в подписку Про.»
     Идея: герой — новая модель, подарок — повод. Заголовок в два этажа «FABLE / 5.2» встаёт первым, затем на
     терракотовую ленту падает коробка, последним — листок «9–16 ноября включительно».
     b0: ярлык, заголовок; b1: полоска «новая старшая модель Claude»; b2: лента, коробка; b3: бирка «на неделю», листок. -->
<style>
  .band { position: absolute; left: -40px; top: 664px; width: 810px; height: 160px; background: var(--grain), var(--terra); transform: rotate(-4deg); }
  .leaf { width: 300px; box-sizing: border-box; text-align: center; padding-bottom: 14px; }
  .leaf .mon { background: var(--navy); color: var(--paper-hi); font-family: PTMono; font-size: 24px; letter-spacing: 5px; padding: 8px 0 6px; }
  .leaf .day { font-family: Oswald; font-weight: 700; font-size: 132px; line-height: 1.08; color: var(--ink); letter-spacing: -2px; white-space: nowrap; }
  .leaf .hr { font-family: PTMono; font-size: 22px; color: var(--navy); }
</style>
<div class="stage">
  <div class="kicker" style="left: 0; top: 20px; --d: var(--b0)">Вышла 9 ноября</div>
  <div class="cross" style="left: 690px; top: 30px; --d: calc(var(--b0) + .3s)"></div>
  <div class="dot" style="left: 640px; top: 250px; width: 84px; height: 84px; --d: calc(var(--b0) + .4s)"></div>
  <div class="cross" style="left: 340px; top: 866px; --d: calc(var(--b3) + .3s)"></div>
  <svg class="ink rings" width="780" height="960">
    <path class="draw thin" pathLength="1" d="M0 118 L 780 118" style="--d: calc(var(--b0) + .2s); --dd: .5s"/>
    <path class="draw thin" pathLength="1" d="M740 330 L 520 470" style="--d: calc(var(--b0) + .5s); --dd: .5s"/>
  </svg>

  <!-- терракотовая лента под коробкой -->
  <div class="slideR" style="position: absolute; left: 0; top: 0; --d: var(--b2)"><div class="band"></div></div>

  <!-- заголовок в два этажа — первым; полоска «новая старшая модель» -->
  <div class="title" style="left: -6px; top: 226px; font-size: 248px; color: var(--navy); --d: var(--b0)">Fable</div>
  <div class="title" style="left: -4px; top: 432px; font-size: 248px; color: var(--terra-dk); --d: calc(var(--b0) + .3s)">5.2</div>
  <div class="abs slideL" style="left: 0; top: 142px; --r: -1.5deg; --d: var(--b1)" data-boil>
    <div class="shadow"><div class="tanp chip" data-torn="lr" data-depth="6">новая старшая модель Claude</div></div>
  </div>

  <!-- коробка: ч/б вырезка Kie -->
  <div class="abs drop sticker" style="left: 404px; top: 462px; width: 350px; height: 330px; --r: 4deg; --d: calc(var(--b2) + .15s)" data-boil>
    <img data-cut="GIFT" data-box="350 330">
  </div>
  <svg class="ink" width="780" height="960"><path class="draw" data-at="неделю" pathLength="1" stroke="#30353C" stroke-width="2.4" fill="none"
       style="--dd: .25s" d="M640 486 C 668 462, 676 440, 672 424"/></svg>
  <div class="abs pop sheet chip shadow" style="left: 586px; top: 380px; --r: 5deg" data-at="неделю:0.15" data-boil>на неделю</div>

  <!-- листок: срок -->
  <div class="abs drop" style="left: 14px; top: 690px; --r: -6deg" data-at="входит" data-boil>
    <div class="shadow"><div class="sheet leaf" data-torn="b" data-depth="7">
      <div class="mon">В ПОДПИСКЕ PRO</div><div class="day">9–16</div><div class="hr">ноября, включительно</div>
    </div></div>
  </div>
</div>
