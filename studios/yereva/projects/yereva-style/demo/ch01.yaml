# Демо стиля студии 10–15 с (/new-studio): `python -m studio demo yereva-style` → projects/yereva-style-demo/.
# Крючок (боль владельца бизнеса) → что делаем → логотип со слоганом → призыв. Без цифр: кейсов у агентства ещё нет.
chapter: ch01
title: "демо стиля"
scenes:
  - id: s01
    template: statement
    lines: ["Вас ищут в Ереване. | А находят конкурентов."]
    min_duration: 3
    params: {text: "Вас *ищут*", sub: "а находят конкурентов", at_beat: 0}
  - id: s02
    template: bullets
    lines: ["Ролики, реклама и карты — | чтобы клиенты | находили | именно вас."]
    params:
      header: "Чтобы вас нашли"
      items:
        - {icon: play, text: "Reels и TikTok", color: accent}
        - {icon: target, text: "Реклама Meta", color: accent}
        - {icon: eye, text: "Google Maps", color: accent}
      first_beat: 1
  - id: s03
    template: media.logo_sting
    lines: ["Будьте на виду."]
    min_duration: 2.5
    params: {tagline: "Будьте *на виду*"}
  - id: s04
    template: cta_end
    lines: ["Напишите нам в директ."]
    min_duration: 3
    params: {title: "Напишите *нам*", button: "Написать в директ", done: "Ждём вас", handle: "@yereva.am", at: 0}
