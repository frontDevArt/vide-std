# CI студии (REFACTOR_PLAN P0.7): ruff (только ошибки), pytest, selftest — офлайн, голос fake.
# Golden сняты на Windows; Linux проверяет, что кадры и timeline не зависят от ОС.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"  # без него на Windows падает вывод с кириллицей
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # как на машине, где сняты golden
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg < /dev/null

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          if ! command -v ffmpeg >/dev/null; then choco install ffmpeg -y --no-progress < /dev/null; fi

      - name: Зависимости
        run: python -m pip install -r requirements-dev.txt

      - name: Версии
        run: |
          python --version
          python -m pip freeze
          ffmpeg -hide_banner -version

      - name: ruff (только ошибки)
        run: ruff check --select E9,F63,F7,F82 .

      - name: pytest
        run: python -m pytest -q

      - name: selftest
        run: python -m studio selftest

      - name: Кадры с расхождением
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff-${{ matrix.os }}
          path: tests/.golden-diff/
          if-no-files-found: ignore
